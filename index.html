<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALAAM - chat.rorraxy.com</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030305">
    <style>
        :root {
            --bg-retail: #030305;
            --card-retail: #08080e;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --pink-solid: linear-gradient(135deg, #ff2a85 0%, #ff479b 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a8a8b8;
            --font-main: 'Poppins', sans-serif;
            --success-green: #2ed573;
        }

        body { 
            background-color: var(--bg-retail); 
            color: var(--text-white); 
            font-family: var(--font-main); 
            -webkit-tap-highlight-color: transparent;
        }

        .gold-gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pink-gradient-text {
            background: var(--pink-solid);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-btn { 
            background: var(--gold-gradient); 
            color: #030305; 
            font-weight: 600; 
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
        }
        .gold-btn:hover { opacity: 0.92; transform: translateY(-0.5px); }

        .pink-btn {
            background: var(--pink-solid);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 18px rgba(255, 42, 133, 0.35);
        }
        .pink-btn:hover { opacity: 0.92; transform: scale(1.03); }

        @keyframes luxuryPulseRing {
            0% {
                transform: scale(0.96);
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5), 0 0 20px rgba(212, 175, 55, 0.15);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 0 14px rgba(212, 175, 55, 0), 0 0 28px rgba(212, 175, 55, 0.3);
            }
            100% {
                transform: scale(0.96);
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0), 0 0 20px rgba(212, 175, 55, 0.15);
            }
        }

        @keyframes outerWaveLoop {
            0% {
                transform: scale(1);
                opacity: 0.6;
            }
            100% {
                transform: scale(1.48);
                opacity: 0;
            }
        }

        .call-circle-loop {
            animation: luxuryPulseRing 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .call-wave-loop {
            animation: outerWaveLoop 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        }

        /* Hide scrollbars completely on both mobile & desktop while allowing scrolling */
        * {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE and Edge */
        }
        *::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
            width: 0;
            height: 0;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden pb-16 md:pb-0 select-none">

    <!-- Top Header Bar -->
    <header class="bg-[#06060b] px-4 py-3 flex justify-between items-center border-b border-white/[0.06] shrink-0 z-30 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="relative p-[2px] rounded-full" style="background: var(--gold-gradient);">
                <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" alt="SALAAM Logo" class="w-10 h-10 rounded-full object-cover bg-[#030305]">
            </div>
            <div>
                <div class="flex items-center space-x-1.5">
                    <h1 class="font-extrabold text-base tracking-widest gold-gradient-text">SALAAM</h1>
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none">
                        <defs>
                            <linearGradient id="badgeGold" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#bf953f"/>
                                <stop offset="50%" stop-color="#fcf6ba"/>
                                <stop offset="100%" stop-color="#aa771c"/>
                            </linearGradient>
                        </defs>
                        <circle cx="12" cy="12" r="10" fill="url(#badgeGold)"/>
                        <path d="M8.5 12.2L10.8 14.5L15.5 9.5" stroke="#030305" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <a href="https://rorraxy.com" target="_blank" class="text-[11px] text-white/95 hover:text-amber-300 transition block tracking-wide">rorraxy.com</a>
            </div>
        </div>
        
        <div class="flex items-center space-x-2.5">
            <button id="installAppBtn" onclick="installPWAApp()" class="hidden gold-btn px-3 py-1.5 rounded-full text-[11px] items-center space-x-1 transition cursor-pointer">
                <span>Install App</span>
            </button>
            <div class="flex items-center space-x-2 bg-[#0b0b12] px-3.5 py-1.5 rounded-full border border-emerald-500/30 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-[#2ed573] inline-block animate-pulse shadow-[0_0_8px_#2ed573]"></span>
                <span class="text-[11px] text-white font-medium tracking-wide">Online</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar: Content Lists -->
        <div id="sidebarSection" class="w-full md:w-[380px] bg-[#06060b] flex flex-col justify-between border-r border-white/[0.06] shrink-0 z-20 h-full">
            <div class="flex flex-col flex-1 overflow-hidden">
                
                <!-- Search Bar -->
                <div id="searchBarContainer" class="p-3 bg-[#030305] border-b border-white/[0.05] shrink-0">
                    <div class="flex items-center space-x-2 bg-[#0a0a12] px-3.5 py-2 rounded-xl border border-white/[0.08] focus-within:border-amber-400/50 transition">
                        <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-0.5" onkeypress="if(event.key === 'Enter') filterContent()">
                        <button onclick="filterContent()" class="cursor-pointer p-1 hover:scale-110 transition-transform" title="Search">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                                <defs>
                                    <linearGradient id="searchIconGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="#bf953f"/>
                                        <stop offset="50%" stop-color="#fcf6ba"/>
                                        <stop offset="100%" stop-color="#aa771c"/>
                                    </linearGradient>
                                </defs>
                                <circle cx="11" cy="11" r="7.5" stroke="url(#searchIconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></circle>
                                <line x1="20.5" y1="20.5" x2="16.35" y2="16.35" stroke="url(#searchIconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Content Area -->
                <div id="sidebarContentList" class="flex-1 overflow-y-auto divide-y divide-white/[0.04] pb-20 md:pb-4">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Active Chat & Interaction Box Section -->
        <div id="workspaceSection" class="hidden md:flex flex-col bg-[#030305] flex-1 overflow-hidden h-full z-10 relative">
            
            <!-- Active Chat Header -->
            <div id="activeChatHeader" class="bg-[#06060b] px-4 py-3 hidden items-center justify-between border-b border-white/[0.06] shrink-0 shadow-md">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebarMobile()" class="md:hidden p-1.5 rounded-lg bg-[#0d0d15] border border-white/10 hover:border-amber-400 transition cursor-pointer" title="Back">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="relative">
                        <img id="activeChatAvatar" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" class="w-9 h-9 rounded-full object-cover border border-amber-500/40">
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#2ed573] rounded-full border-2 border-[#06060b]"></span>
                    </div>
                    <div>
                        <span id="activeChatTitle" class="font-semibold text-white text-xs tracking-wide block">Select a contact</span>
                        <p id="activeChatStatus" class="text-[10px] text-[#2ed573] font-medium">Online</p>
                    </div>
                </div>

                <!-- Call & Action Icons -->
                <div class="flex items-center space-x-2">
                    <button onclick="triggerCall('audio')" class="p-2 bg-[#0b0b12] rounded-xl hover:bg-[#141420] border border-white/10 hover:border-amber-400/50 transition group cursor-pointer" title="Audio Call">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </button>
                    <button onclick="triggerCall('video')" class="p-2 bg-[#0b0b12] rounded-xl hover:bg-[#141420] border border-white/10 hover:border-amber-400/50 transition group cursor-pointer" title="Video Call">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2.5" ry="2.5"></rect>
                        </svg>
                    </button>
                    <button onclick="clearChatHistory()" class="p-2 bg-[#0b0b12] rounded-xl hover:bg-pink-950/30 border border-white/10 hover:border-pink-500/50 transition group cursor-pointer" title="Clear Chat">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="#ff3b93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Messages Area (Centered Content Properly for both Mobile & Desktop) -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center">
                <div class="flex flex-col items-center space-y-3 max-w-xs text-center">
                    <div class="w-14 h-14 rounded-2xl bg-[#0a0a12] flex items-center justify-center shadow-lg">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                    </div>
                    <p class="text-sm font-bold gold-gradient-text tracking-wide">Assalamu Alaikum</p>
                    <p class="text-[11px] text-[var(--text-gray)]">Select a contact to start messaging.</p>
                </div>
            </div>

            <!-- Input Bar with Perfectly Centered Telegram Style Luxury Golden Send Arrow Icon -->
            <div id="chatInputBar" class="bg-[#06060b] px-3 py-2.5 hidden items-center border-t border-white/[0.06] shrink-0 sticky bottom-0 z-20">
                <div class="flex-1 flex items-center bg-[#0a0a12] rounded-2xl px-3.5 py-2 space-x-2.5 border border-white/[0.08] focus-within:border-amber-400/50 transition">
                    <label class="cursor-pointer hover:scale-110 transition-transform flex items-center justify-center shrink-0" title="Attach Files (Multiple)">
                        <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                        <input type="file" id="universalFileInput" accept="image/*,video/*,application/pdf,.doc,.docx,.zip" multiple class="hidden" onchange="sendUniversalFile(this)">
                    </label>
                    <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-1 min-w-0" oninput="toggleSendButton()" onkeypress="if(event.key === 'Enter') sendTextMessage()">
                    
                    <!-- Telegram Style Luxury Golden Send Arrow Icon (Centered vertically in input bar) -->
                    <button id="sendBtn" onclick="sendTextMessage()" class="hidden cursor-pointer hover:scale-110 transition-transform p-1 shrink-0 flex items-center justify-center" title="Send">
                        <svg class="w-5 h-5 -rotate-45" viewBox="0 0 24 24" fill="none">
                            <defs>
                                <linearGradient id="telegramSendGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#bf953f"/>
                                    <stop offset="50%" stop-color="#fcf6ba"/>
                                    <stop offset="100%" stop-color="#aa771c"/>
                                </linearGradient>
                            </defs>
                            <path d="M22 2L11 13" stroke="url(#telegramSendGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" fill="url(#telegramSendGrad)" fill-opacity="0.25" stroke="url(#telegramSendGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Fixed Bottom 3 Navigation Menu Bar -->
    <nav class="fixed bottom-0 left-0 right-0 md:w-[380px] bg-[#06060b]/95 backdrop-blur-md grid grid-cols-3 py-2 text-center border-t border-white/[0.08] shrink-0 z-50 shadow-[0_-8px_25px_rgba(0,0,0,0.85)]">
        <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center justify-center space-y-1 py-0.5 transition group cursor-pointer">
            <div class="nav-icon-wrap transition-transform duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="8" r="4"></circle>
                    <path d="M20 21a8 8 0 0 0-16 0"></path>
                    <circle cx="12" cy="12" r="10" stroke-opacity="0.4"></circle>
                </svg>
            </div>
            <span class="nav-label text-[10px] text-gray-400 font-medium tracking-wide">Profile</span>
        </button>
        <button onclick="switchTab('contact')" id="tabContact" class="flex flex-col items-center justify-center space-y-1 py-0.5 transition group cursor-pointer">
            <div class="nav-icon-wrap transition-transform duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="9" cy="7" r="4"></circle>
                    <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                    <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                </svg>
            </div>
            <span class="nav-label text-[10px] text-gray-400 font-medium tracking-wide">Contact</span>
        </button>
        <button onclick="switchTab('chat')" id="tabChat" class="flex flex-col items-center justify-center space-y-1 py-0.5 transition group cursor-pointer">
            <div class="nav-icon-wrap transition-transform duration-200">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                </svg>
            </div>
            <span class="nav-label text-[10px] text-gray-400 font-medium tracking-wide">Chat</span>
        </button>
    </nav>

    <!-- Custom Confirmation Modal -->
    <div id="customConfirmModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#0b0b14] border border-white/10 p-6 rounded-3xl max-w-xs w-full text-center space-y-4 shadow-2xl">
            <p id="confirmModalText" class="text-xs text-white font-medium">Are you sure you want to clear all messages?</p>
            <div class="flex space-x-2">
                <button onclick="closeConfirmModal(false)" class="flex-1 py-2 bg-[#141420] text-xs rounded-xl text-gray-300 hover:bg-[#1c1c2e] cursor-pointer">Cancel</button>
                <button id="confirmModalYesBtn" onclick="closeConfirmModal(true)" class="flex-1 py-2 pink-btn text-xs rounded-xl cursor-pointer">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 bg-[#0d0d16] text-white text-xs px-4 py-2 rounded-full border border-white/15 shadow-2xl z-50 hidden items-center space-x-2">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-[#2ed573]"></span>
        <span id="toastText">Action completed</span>
    </div>

    <!-- Script Logic -->
    <script>
        let currentTab = 'contact';
        let currentActiveRecipient = null;
        let activeCallType = null;
        let localMessageStore = {};
        let deferredPrompt = null;
        let confirmCallback = null;

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('installAppBtn');
            if(btn) {
                btn.classList.remove('hidden');
                btn.classList.add('flex');
            }
        });

        function installPWAApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        showToast('App installed successfully!');
                    }
                    deferredPrompt = null;
                    document.getElementById('installAppBtn').classList.add('hidden');
                });
            } else {
                showToast('App is already installed or check HTTPS domain.');
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(() => {});
            });
        }

        function showCustomConfirm(text, callback) {
            document.getElementById('confirmModalText').innerText = text;
            confirmCallback = callback;
            const modal = document.getElementById('customConfirmModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal(result) {
            const modal = document.getElementById('customConfirmModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if(confirmCallback) confirmCallback(result);
            confirmCallback = null;
        }

        const RESERVED_USERNAMES = [
            'mrmasudar', 'masudar', 'masudarrahman', 'mrmasudarenterprise',
            'rorraxy', 'rorraxyofficial', 'rorraxyadmin', 'rorraxysupport',
            'salaam', 'salaamchat', 'admin', 'administrator', 'support',
            'ceo', 'founder', 'official', 'system', 'root', 'help', 'moderator'
        ];

        let userProfile = {
            name: "Masudar Rahman",
            phone: "+8801700000000",
            username: "mrmasudar",
            dob: "1995-01-01",
            avatar: "https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg",
            status: "Online",
            isOfficialFounder: true
        };

        let deviceContacts = [
            { name: "rorraxy", phone: "support", appUser: true, status: "Admin Support", lastMsg: "" },
            { name: "Mamun Rashid", phone: "+8801800000000", appUser: true, status: "Online", lastMsg: "" },
            { name: "Local Friend", phone: "+8801900000000", appUser: false, status: "Offline", lastMsg: "" }
        ];

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toastBanner');
            const dot = document.getElementById('toastDot');
            document.getElementById('toastText').innerText = msg;
            dot.className = isError ? "w-2 h-2 rounded-full bg-[#ff2a85]" : "w-2 h-2 rounded-full bg-[#2ed573]";
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2800);
        }

        function isUsernameAllowed(rawUsername) {
            const cleaned = rawUsername.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (cleaned.length < 3) {
                return { valid: false, reason: "Username must be at least 3 characters." };
            }
            const isRestricted = RESERVED_USERNAMES.some(reserved => 
                cleaned === reserved || cleaned.includes('rorraxy') || cleaned.includes('mrmasudar') || cleaned.includes('salaam')
            );
            if (isRestricted && !userProfile.isOfficialFounder) {
                return { valid: false, reason: "This username is reserved and protected." };
            }
            return { valid: true, formatted: rawUsername.toLowerCase().replace(/[^a-z0-9._]/g, '') };
        }

        function switchTab(tab) {
            currentTab = tab;
            ['profile', 'contact', 'chat'].forEach(t => {
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if(btn) {
                    const svg = btn.querySelector('svg');
                    const wrap = btn.querySelector('.nav-icon-wrap');
                    const label = btn.querySelector('.nav-label');
                    svg.setAttribute('stroke', '#e5c158');
                    wrap.classList.remove('scale-110');
                    label.className = "nav-label text-[10px] text-gray-400 font-medium tracking-wide";
                }
            });

            const activeBtn = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
            if(activeBtn) {
                const svg = activeBtn.querySelector('svg');
                const wrap = activeBtn.querySelector('.nav-icon-wrap');
                const label = activeBtn.querySelector('.nav-label');
                svg.setAttribute('stroke', '#ff2a85');
                wrap.classList.add('scale-110');

        function formatMessageText(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            let formatted = text.replace(urlRegex, '<a href="$1" target="_blank" class="text-amber-300 underline break-all">$1</a>');
            if (/^\+?[0-9\-\(\)\s]{7,15}$/.test(text.trim())) {
                return `<a href="tel:${text.trim()}" class="text-amber-300 underline font-semibold">${text}</a>`;
            }
            return formatted;
        }

        async function sendTextMessage() {
            if(!currentActiveRecipient) return;
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(!text) return;

            input.value = '';
            toggleSendButton();

            const key = currentActiveRecipient.phone;
            if(!localMessageStore[key]) localMessageStore[key] = [];
            const msgId = 'msg_' + Date.now() + '_' + Math.random();
            localMessageStore[key].push({ id: msgId, phone_number: userProfile.phone, message_text: text, type: 'text' });

            const contactObj = deviceContacts.find(c => c.phone === key);
            if(contactObj) contactObj.lastMsg = text;
            if(currentTab === 'chat') renderChatStories();

            try {
                await fetch('/api/chat?action=send_message', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ sender_phone: userProfile.phone, recipient_phone: currentActiveRecipient.phone, message_text: text })
                });
            } catch (e) {}
            loadMessages();
        }

        async function sendUniversalFile(inputElement) {
            if(!currentActiveRecipient || !inputElement.files || inputElement.files.length === 0) return;
            const files = Array.from(inputElement.files);
            const key = currentActiveRecipient.phone;
            if(!localMessageStore[key]) localMessageStore[key] = [];

            for (const file of files) {
                let fileType = 'file';
                if(file.type.startsWith('image/')) fileType = 'image';
                else if(file.type.startsWith('video/')) fileType = 'video';

                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        const fileDataUrl = e.target.result;
                        const msgId = 'msg_' + Date.now() + '_' + Math.random();
                        localMessageStore[key].push({ 
                            id: msgId, 
                            phone_number: userProfile.phone, 
                            message_text: file.name, 
                            media_url: fileDataUrl, 
                            type: fileType 
                        });

                        const contactObj = deviceContacts.find(c => c.phone === key);
                        if(contactObj) contactObj.lastMsg = fileType === 'image' ? 'Photo' : (fileType === 'video' ? 'Video' : `${file.name}`);
                        
                        try {
                            await fetch('/api/chat?action=send_message', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ 
                                    sender_phone: userProfile.phone, 
                                    recipient_phone: currentActiveRecipient.phone, 
                                    message_text: file.name, 
                                    media_url: fileDataUrl, 
                                    file_type: fileType 
                                })
                            });
                        } catch (err) {}
                        resolve();
                    };
                    reader.readAsDataURL(file);
                });
            }

            inputElement.value = '';
            if(currentTab === 'chat') renderChatStories();
            loadMessages();
        }

        async function loadMessages() {
            if(!currentActiveRecipient) return;
            const container = document.getElementById('chatMessages');

            try {
                const res = await fetch(`/api/chat?action=get_messages&user1=${userProfile.phone}&user2=${currentActiveRecipient.phone}`);
                if(res.ok) {
                    const data = await res.json();
                    if(data.success && Array.isArray(data.messages)) {
                        messages = data.messages;
                    }
                }
            } catch (e) {}

            container.innerHTML = '';
            if(messages.length > 0) {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col";

                    const isVid = msg.type === 'video' || (mediaSrc && (mediaSrc.startsWith('data:video') || /\.(mp4|webm|mov)$/i.test(msg.message_text || '')));

                    let contentHtml = '';
                    
                    // Pure Pink Delete Icon with NO dark circular background container
                    const deleteIconSvg = `<svg class="w-4 h-4 text-[#ff2a85] hover:scale-110 transition cursor-pointer drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;
                    
                    // Golden Gradient Share icon
                    const gradId = `shareGoldGrad_${idx}`;
                    const shareIconSvg = `<svg class="w-4 h-4 hover:scale-110 transition cursor-pointer" viewBox="0 0 24 24" fill="none">
                        <defs>
                            <linearGradient id="${gradId}" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#bf953f"/>
                                <stop offset="50%" stop-color="#fcf6ba"/>
                                <stop offset="100%" stop-color="#aa771c"/>
                            </linearGradient>
                        </defs>
                        <circle cx="18" cy="5" r="3" stroke="url(#${gradId})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></circle>
                        <circle cx="6" cy="12" r="3" stroke="url(#${gradId})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></circle>
                        <circle cx="18" cy="19" r="3" stroke="url(#${gradId})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></circle>
                        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49" stroke="url(#${gradId})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></line>
                        <line x1="15.41" y1="6.51" x2="8.59" y2="10.49" stroke="url(#${gradId})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></line>
                    </svg>`;

                    if (isImg && mediaSrc) {
                        contentHtml = `
                            <div class="space-y-1 relative">
                                <div class="absolute top-1.5 right-1.5 z-20">
                                    <button onclick="deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})" class="cursor-pointer flex items-center justify-center bg-transparent border-0 p-1" title="Delete">${deleteIconSvg}</button>
                                </div>
                                <div class="overflow-hidden rounded-xl bg-black/40 flex justify-center items-center">
                                    <img src="${mediaSrc}" alt="Image" class="max-h-72 w-full object-cover">
                                </div>
                                <div class="flex items-center justify-between pt-1 px-1">
                                    <a href="${mediaSrc}" download="salaam_image.jpg" class="text-[11px] pink-gradient-text font-semibold hover:underline cursor-pointer">Download</a>
                                    <button onclick="shareMessageContent('${msg.message_text || ''}', '${mediaSrc}')" class="p-1 cursor-pointer" title="Share">${shareIconSvg}</button>
                                </div>
                            </div>`;
                    } else if (isVid && mediaSrc) {
                        contentHtml = `
                            <div class="space-y-1 relative">
                                <div class="absolute top-1.5 right-1.5 z-20">
                                    <button onclick="deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})" class="cursor-pointer flex items-center justify-center bg-transparent border-0 p-1" title="Delete">${deleteIconSvg}</button>
                                </div>
                                <div class="overflow-hidden rounded-xl bg-black/40">
                                    <video src="${mediaSrc}" controls class="max-h-72 w-full object-cover"></video>
                                </div>
                                <div class="flex items-center justify-between pt-1 px-1">
                                    <a href="${mediaSrc}" download="salaam_video.mp4" class="text-[11px] pink-gradient-text font-semibold hover:underline cursor-pointer">Download</a>
                                    <button onclick="shareMessageContent('${msg.message_text || ''}', '${mediaSrc}')" class="p-1 cursor-pointer" title="Share">${shareIconSvg}</button>
                                </div>
                            </div>`;
                    } else {
                        // Text messages: completely clean (no share or delete buttons visible), selectable text, delete via double-click or long press
                        div.classList.add('select-text');
                        div.setAttribute('ondblclick', `deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})`);
                        
                        let pressTimer;
                        div.addEventListener('touchstart', () => {
                            pressTimer = setTimeout(() => {
                                deleteSingleMessage(currentActiveRecipient.phone, idx);
                            }, 650);
                        }, { passive: true });
                        div.addEventListener('touchend', () => clearTimeout(pressTimer));
                        div.addEventListener('touchmove', () => clearTimeout(pressTimer));

                        contentHtml = `
                            <div class="px-1 py-0.5 select-text">
                                <p class="whitespace-pre-wrap break-words text-xs select-text">${formatMessageText(msg.message_text)}</p>
                            </div>`;
                    }

                    div.innerHTML = contentHtml;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } else {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center";
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-3 max-w-xs text-center">
                        <div class="w-14 h-14 rounded-2xl bg-[#0a0a12] flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-bold gold-gradient-text tracking-wide">Start Conversation</p>
                        <p class="text-[11px] text-[var(--text-gray)]">Send a message or attach files below.</p>
                    </div>`;
            }
        }
    </script>
</body>
</html>
