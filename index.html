<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SALAAM | rorraxy.com</title>
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#04120b">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/verify.css">
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden fixed inset-0">

    <!-- Auto-Verify & Install Overlay -->
    <div id="verifyOverlay" style="display: none;">
        <div class="verify-card space-y-4 text-center shadow-2xl">
            <div class="space-y-2">
                <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-clean mx-auto">
                <h1 class="brand-title-font text-2xl font-extrabold gold-gradient-text">SALAAM</h1>
                <p class="text-[10px] text-white/75 tracking-widest font-semibold uppercase">Private Global Messenger</p>
                <div id="pwaInstallContainer" class="pt-2">
                    <button onclick="installPWAApp()" class="gold-btn w-full py-3 rounded-xl text-xs font-bold shadow-lg inline-flex items-center justify-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-download"></i><span>INSTALL & CONNECT</span>
                    </button>
                </div>
            </div>

            <div id="verifyStep1" class="space-y-3.5 text-left hidden">
                <div class="space-y-1">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text">FULL NAME <span class="text-red-500">*</span></label>
                    <input type="text" id="vFullName" placeholder="Enter your full name" class="w-full theme-input text-xs px-3.5 py-3 rounded-xl text-white focus:outline-none border border-white/10">
                </div>
                <div class="space-y-1">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text">MOBILE NUMBER <span class="text-red-500">*</span></label>
                    <div class="flex space-x-2 w-full">
                        <select id="vCountrySelect" onchange="updatePhoneValidation()" class="theme-input text-xs px-2.5 py-3 rounded-xl text-amber-300 font-bold focus:outline-none border border-white/10 cursor-pointer shrink-0">
                            <option value="+880|10" selected>🇧🇩 +880</option>
                            <option value="+966|9">🇸🇦 +966</option>
                            <option value="+971|9">🇦🇪 +971</option>
                            <option value="+91|10">🇮🇳 +91</option>
                            <option value="+92|10">🇵🇰 +92</option>
                            <option value="+1|10">🇺🇸 +1</option>
                            <option value="+44|10">🇬🇧 +44</option>
                        </select>
                        <input type="tel" id="vPhoneInput" placeholder="1700000000" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="flex-1 min-w-0 theme-input text-xs px-3.5 py-3 rounded-xl text-white focus:outline-none border border-white/10">
                    </div>
                </div>
                <button onclick="submitVerifyStep1()" class="w-full py-3 gold-btn text-xs rounded-xl cursor-pointer mt-1 font-bold flex items-center justify-center space-x-2 shadow-lg">
                    <span>CONTINUE</span> <i class="fa-solid fa-circle-check" style="color: #EC4899;"></i>
                </button>
            </div>

            <div id="verifyStep2" class="space-y-3.5 text-left hidden">
                <div class="text-center bg-black/60 p-3.5 rounded-2xl border border-amber-400/30 space-y-1.5">
                    <h2 id="vDisplayCode" class="text-2xl sm:text-3xl font-extrabold gold-gradient-text tracking-[6px]">------</h2>
                    <button onclick="autoFillOtp()" class="text-[11px] pink-gradient-text font-bold underline cursor-pointer">Tap to Auto-Fill Code</button>
                </div>
                <div class="space-y-1 text-center">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text block">ENTER 6-DIGIT CODE <span class="text-red-500">*</span></label>
                    <input type="text" id="vOtpInput" placeholder="000000" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full theme-input text-center text-base font-extrabold tracking-[6px] px-3.5 py-3 rounded-xl text-white focus:outline-none border border-white/10">
                </div>
                <button onclick="submitVerifyStep2()" class="w-full py-3 gold-btn text-xs rounded-xl cursor-pointer mt-1 font-bold flex items-center justify-center space-x-2 shadow-lg">
                    <span>VERIFY & START</span> <i class="fa-solid fa-circle-check" style="color: #EC4899;"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Header Bar -->
    <header class="theme-surface px-4 py-3 flex justify-between items-center shrink-0 z-30 border-b border-white/5">
        <div class="flex items-center space-x-3">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" alt="Logo" class="header-logo-clean" style="width: 38px; height: 38px;">
            <div>
                <div class="flex items-center space-x-1.5">
                    <h1 class="brand-title-font font-extrabold text-lg sm:text-xl gold-gradient-text leading-none">SALAAM</h1>
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.8 4.2L18.3 4.3L19.5 7.6L22 10L20.8 13.3L21.5 16.8L18.3 18.4L16.7 21.5L13.3 20.8L10 22L7.6 19.5L4.3 18.3L4.2 14.8L2 12L4.2 9.2L4.3 5.7L7.6 4.5L10 2L12 2Z" fill="#F5D061"/><path d="M8.5 12.2L10.8 14.5L15.6 9.5" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <a href="https://rorraxy.com" target="_blank" class="text-[11px] text-white/70 hover:text-amber-300 transition block tracking-wider mt-0.5">rorraxy.com</a>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="openLiveBroadcastModal()" class="px-3 py-1.5 rounded-xl pink-btn text-[10px] font-bold cursor-pointer inline-flex items-center space-x-1.5 shadow-md">
                <span class="w-2 h-2 rounded-full bg-white animate-ping"></span><span>LIVE</span>
            </button>
            <button onclick="openNotificationModal()" class="relative p-2.5 theme-card rounded-2xl hover:brightness-125 transition cursor-pointer border border-white/5">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span id="headerNotifBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full pink-btn text-[9px] flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden relative min-h-0 w-full">
        <div id="sidebarSection" class="w-full md:w-[360px] theme-surface flex flex-col justify-between shrink-0 z-20 h-full min-h-0 pb-16">
            <div class="flex flex-col flex-1 overflow-hidden min-h-0">
                <div id="searchBarContainer" class="p-3 shrink-0" style="background-color: var(--bg-main);">
                    <div class="flex items-center space-x-2 theme-input px-3.5 py-2.5 rounded-2xl">
                        <input type="text" id="searchInput" placeholder="Search name or dial number..." class="w-full bg-transparent text-xs focus:outline-none text-white placeholder-gray-500" oninput="filterContent()">
                        <button onclick="filterContent()" class="cursor-pointer p-1 shrink-0"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7.5" stroke="#F5D061" stroke-width="2.2"/><line x1="20.5" y1="20.5" x2="16.35" y2="16.35" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round"/></svg></button>
                    </div>
                </div>
                <div id="sidebarContentList" class="flex-1 overflow-y-auto space-y-1.5 p-3 pb-20"></div>
            </div>
        </div>

        <div id="workspaceSection" class="hidden md:flex flex-col flex-1 overflow-hidden h-full min-h-0 z-10 relative" style="background-color: var(--bg-main);">
            <div id="activeChatHeader" class="theme-surface px-4 py-3 hidden items-center justify-between shrink-0 border-b border-white/5">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebarMobile()" class="md:hidden p-1.5 rounded-xl theme-card cursor-pointer">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <div onclick="openRecipientInfoModal()" class="flex items-center space-x-3 cursor-pointer group">
                        <div class="relative"><img id="activeChatAvatar" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/rorraxyfree/mr%20masudar%20logo%20(3).png" class="w-9 h-9 rounded-full object-cover bg-black"><span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#2ed573] rounded-full border-2 border-black"></span></div>
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <span id="activeChatTitle" class="font-semibold text-white text-xs tracking-wide group-hover:text-amber-300 transition">Select a contact</span>
                                <span id="activeChatHeaderTick"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="startWhatsAppCall('audio')" class="p-2 theme-card rounded-xl hover:brightness-125 transition cursor-pointer" title="Audio Call"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
                    <button onclick="startWhatsAppCall('video')" class="p-2 theme-card rounded-xl hover:brightness-125 transition cursor-pointer" title="Video Call"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2.5" ry="2.5"></rect></svg></button>
                    <button onclick="confirmClearChatHistory()" class="p-2 theme-card rounded-xl hover:bg-pink-950/20 transition cursor-pointer" title="Clear Chat"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                </div>
            </div>

            <div id="chatMessages" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 flex flex-col justify-start">
                <div class="flex flex-col items-center justify-center space-y-3 max-w-xs text-center m-auto">
                    <div class="w-14 h-14 rounded-2xl theme-card flex items-center justify-center">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <p class="text-sm font-bold gold-gradient-text">Assalamu Alaikum</p>
                    <p class="text-[11px] text-gray-400">Select a contact to start messaging or calling.</p>
                </div>
            </div>

            <div id="chatInputBar" class="theme-surface px-3 py-2.5 hidden items-center shrink-0 z-20">
                <div class="flex-1 flex items-center theme-input rounded-2xl px-3.5 py-2 space-x-2.5">
                    <label class="cursor-pointer hover:scale-110 transition-transform flex items-center justify-center shrink-0" title="Attach File">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        <input type="file" id="universalFileInput" accept="image/*,video/*,audio/*,application/pdf,.doc,.docx,.zip,.txt" multiple class="hidden" onchange="handleUniversalFileUpload(this)">
                    </label>
                    <input type="text" id="messageInput" placeholder="Write a message..." class="flex-1 bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-1 min-w-0 selectable-text" oninput="toggleSendButton()" onkeypress="if(event.key === 'Enter') sendTextMessage()">
                    <button id="sendBtn" onclick="sendTextMessage()" class="hidden cursor-pointer hover:scale-110 transition-transform p-1 shrink-0 items-center justify-center">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav id="bottomNavBar" class="fixed bottom-0 left-0 right-0 md:w-[360px] theme-surface flex justify-center items-center py-2.5 shrink-0 z-40 border-t border-white/5">
        <div class="flex items-center justify-around w-full px-8">
            <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 cursor-pointer focus:outline-none">
                <svg id="iconProfile" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span id="labelProfile" class="nav-label text-[10px] gold-gradient-text font-semibold">Settings</span>
            </button>
            <button onclick="switchTab('contact')" id="tabContact" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 cursor-pointer focus:outline-none">
                <svg id="iconContact" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span id="labelContact" class="nav-label text-[10px] pink-gradient-text font-bold">Contacts</span>
            </button>
            <button onclick="switchTab('chat')" id="tabChat" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 cursor-pointer focus:outline-none">
                <svg id="iconChat" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                <span id="labelChat" class="nav-label text-[10px] gold-gradient-text font-semibold">Chats</span>
            </button>
        </div>
    </nav>

    <!-- Modals & Toasts -->
    <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 theme-card text-white text-xs px-4 py-2 rounded-full shadow-2xl z-50 hidden items-center space-x-2">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-[#2ed573]"></span><span id="toastText">Done</span>
    </div>

    <!-- Modular JavaScript Files Connection -->
    <script src="/verify.js"></script>
    <script src="/call.js"></script>
    <script src="/p2p_file_transfer.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            checkInitialVerification();
        });
    </script>
</body>
</html>
