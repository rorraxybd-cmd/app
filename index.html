<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALAAM - rorraxy.com</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        :root {
            --bg-retail: #030305;
            --card-retail: #06060a;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --pink-solid: linear-gradient(135deg, #ff2a85 0%, #ff479b 100%);
            --gold-solid: #d4af37;
            --text-white: #ffffff;
            --text-gray: #a8a8b8;
            --font-main: 'Poppins', sans-serif;
            --success-green: #2ed573;
        }

        body { 
            background-color: var(--bg-retail); 
            color: var(--text-white); 
            font-family: var(--font-main); 
            -webkit-tap-highlight-color: transparent;
        }

        .gold-gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pink-gradient-text {
            background: var(--pink-solid);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-btn { background: var(--gold-gradient); color: #000; font-weight: 600; }
        .gold-btn:hover { opacity: 0.9; }
        
        ::-webkit-scrollbar { width: 3px; height: 3px; }
        ::-webkit-scrollbar-track { background: var(--bg-retail); }
        ::-webkit-scrollbar-thumb { background: #b38728; border-radius: 4px; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden pb-16 md:pb-0">

    <!-- Top Header Bar (Matching SALAAM and White rorraxy.com URL) -->
    <header class="bg-[#06060a] px-4 py-3 flex justify-between items-center border-b border-gray-900 shrink-0 z-30">
        <div class="flex items-center space-x-3">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" alt="logo" class="w-10 h-10 rounded-full object-cover border border-amber-500/40">
            <div>
                <h1 class="font-extrabold text-base tracking-wider gold-gradient-text">SALAAM</h1>
                <a href="https://rorraxy.com" target="_blank" class="text-[10px] text-white hover:underline block opacity-90">rorraxy.com</a>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-[#030305] px-3.5 py-1.5 rounded-full border border-gray-800">
            <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
            <span class="text-[11px] text-white font-medium">Online</span>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar: Content Lists -->
        <div id="sidebarSection" class="w-full md:w-[380px] bg-[#06060a] flex flex-col justify-between border-r border-gray-900 shrink-0 z-20 h-full">
            <div class="flex flex-col flex-1 overflow-hidden">
                <!-- Search Bar with Magnifying Glass Icon -->
                <div id="searchBarContainer" class="p-3 bg-[#030305] border-b border-gray-900 flex items-center space-x-2 shrink-0">
                    <span class="text-sm gold-gradient-text px-1">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-transparent text-xs focus:outline-none text-white placeholder-gray-500" oninput="filterContent()">
                </div>

                <!-- Dynamic Content Area -->
                <div id="sidebarContentList" class="flex-1 overflow-y-auto divide-y divide-[#111118] pb-16">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>

        <!-- Active Chat & Interaction Box Section -->
        <div id="workspaceSection" class="hidden md:flex flex-col bg-[#030305] flex-1 overflow-hidden h-full z-10">
            <div id="activeChatHeader" class="bg-[#06060a] px-4 py-3 hidden items-center justify-between border-b border-gray-900 shrink-0">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebarMobile()" class="md:hidden text-amber-400 text-lg mr-1">⬅️</button>
                    <img id="activeChatAvatar" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" class="w-9 h-9 rounded-full object-cover">
                    <div>
                        <span id="activeChatTitle" class="font-medium text-white text-xs">Select a contact</span>
                        <p id="activeChatStatus" class="text-[9px] text-[var(--success-green)]">Online</p>
                    </div>
                </div>
                <!-- Call & Action Icons in Center/Right Header -->
                <div class="flex items-center space-x-2">
                    <button onclick="triggerCall('audio')" class="text-sm px-3.5 py-1.5 bg-[#030305] rounded-md hover:bg-[#1a1a24] gold-gradient-text border border-amber-500/20" title="Audio Call">📞</button>
                    <button onclick="triggerCall('video')" class="text-sm px-3.5 py-1.5 bg-[#030305] rounded-md hover:bg-[#1a1a24] gold-gradient-text border border-amber-500/20" title="Video Call">📹</button>
                    <button onclick="clearChatHistory()" class="text-xs text-red-400 bg-[#030305] px-3 py-1.5 rounded-md border border-red-900/30" title="Clear Chat">🗑️</button>
                </div>
            </div>

            <!-- Messages Area -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center">
                <div class="text-[var(--text-gray)] text-xs text-center">Select a contact from the Contact menu to start messaging.</div>
            </div>

            <!-- Clean Input Bar -->
            <div id="chatInputBar" class="bg-[#06060a] px-4 py-3 hidden items-center space-x-2 border-t border-gray-900 shrink-0 relative">
                <div class="flex-1 flex items-center bg-[#030305] rounded-xl px-3 py-2 space-x-3 border border-gray-800">
                    <label class="cursor-pointer text-xl gold-gradient-text hover:opacity-80 transition" title="Attach File">
                        📎
                        <input type="file" class="hidden" onchange="sendUniversalFile(this)">
                    </label>
                    <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-transparent text-xs focus:outline-none text-white placeholder-gray-500" oninput="toggleSendButton()" onkeypress="if(event.key === 'Enter') sendTextMessage()">
                </div>
                <button id="sendBtn" onclick="sendTextMessage()" class="gold-btn px-5 py-2.5 text-xs rounded-xl transition hidden">Send</button>
            </div>
        </div>

    </div>

    <!-- Fixed Bottom 3 Navigation Menu Bar (Modern Luxury Geometric Icons) -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#030305] grid grid-cols-3 py-2 text-center border-t border-gray-800 shrink-0 z-50 shadow-2xl">
        <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center justify-center space-y-0.5 transition">
            <span class="text-xl gold-gradient-text">🛡️</span>
            <span class="text-[10px] text-gray-400 font-medium">Profile</span>
        </button>
        <button onclick="switchTab('contact')" id="tabContact" class="flex flex-col items-center justify-center space-y-0.5 transition">
            <span class="text-xl gold-gradient-text">📇</span>
            <span class="text-[10px] text-gray-400 font-medium">Contact</span>
        </button>
        <button onclick="switchTab('chat')" id="tabChat" class="flex flex-col items-center justify-center space-y-0.5 transition">
            <span class="text-xl gold-gradient-text">✉️</span>
            <span class="text-[10px] text-gray-400 font-medium">Chat</span>
        </button>
    </div>

    <!-- Script Logic -->
    <script>
        let currentTab = 'contact';
        let currentActiveRecipient = null;
        let activeCallType = null;

        let userProfile = {
            name: "Masudar Rahman",
            phone: "+8801700000000",
            username: "masudar",
            dob: "1995-01-01",
            avatar: "https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg",
            status: "Online"
        };

        let deviceContacts = [
            { name: "rorraxy", phone: "support", appUser: true, status: "Admin Support" },
            { name: "Mamun Rashid", phone: "+8801800000000", appUser: true, status: "Online" },
            { name: "Local Friend", phone: "+8801900000000", appUser: false, status: "Offline" }
        ];

        function switchTab(tab) {
            currentTab = tab;
            ['profile', 'contact', 'chat'].forEach(t => {
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if(btn) {
                    btn.children[0].className = "text-xl gold-gradient-text";
                    btn.children[1].className = "text-[10px] text-gray-400 font-medium";
                }
            });

            const activeBtn = document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1));
            if(activeBtn) {
                activeBtn.children[0].className = "text-2xl pink-gradient-text";
                activeBtn.children[1].className = "text-[10px] text-amber-300 font-bold";
            }

            const searchBar = document.getElementById('searchBarContainer');
            if(tab === 'profile') {
                searchBar.style.display = 'none';
                renderProfileView();
            } else {
                searchBar.style.display = 'flex';
                if(tab === 'chat') renderChatStories();
                else if(tab === 'contact') renderDeviceContacts();
            }

            if(window.innerWidth < 768) {
                document.getElementById('sidebarSection').style.display = 'flex';
                document.getElementById('workspaceSection').style.display = 'none';
            }
        }

        function renderProfileView() {
            document.getElementById('sidebarContentList').innerHTML = `
                <div class="p-4 space-y-4 text-xs">
                    <div class="flex flex-col items-center space-y-2 pb-3 border-b border-gray-800">
                        <div class="relative">
                            <img id="profileAvatarImg" src="${userProfile.avatar}" class="w-20 h-20 rounded-full object-cover border-2 border-amber-500">
                            <label class="absolute bottom-0 right-0 bg-[#030305] p-1.5 rounded-full border border-amber-500 cursor-pointer text-xs shadow-lg" title="Change Photo">
                                📷
                                <input type="file" accept="image/*" class="hidden" onchange="updateProfileAvatar(this)">
                            </label>
                        </div>
                        <p class="font-bold text-sm gold-gradient-text">${userProfile.name}</p>
                        <p class="text-[10px] text-white opacity-80">URL: <span class="text-amber-300">rorraxy.com/${userProfile.username}</span></p>
                    </div>

                    <div class="space-y-2 bg-[#030305] p-3 rounded-xl border border-gray-800">
                        <div class="flex justify-between items-center mb-1">
                            <span class="font-bold gold-gradient-text text-xs">Profile Details</span>
                            <button onclick="toggleProfileEdit()" class="text-[10px] text-amber-400 underline">Edit Info</button>
                        </div>
                        <p class="text-white"><b>Name:</b> ${userProfile.name}</p>
                        <p class="text-white"><b>Phone:</b> ${userProfile.phone}</p>
                        <p class="text-white"><b>Username:</b> ${userProfile.username}</p>
                        <p class="text-white"><b>Birth Date:</b> ${userProfile.dob}</p>
                    </div>

                    <div id="profileEditForm" class="space-y-2 bg-[#030305] p-3 rounded-xl border border-gray-800 hidden">
                        <p class="font-bold gold-gradient-text text-xs">Edit Information</p>
                        <input type="text" id="inputFullName" value="${userProfile.name}" class="w-full bg-[#06060a] text-xs px-2.5 py-1.5 rounded text-white border border-gray-800">
                        <input type="text" id="inputPhone" value="${userProfile.phone}" class="w-full bg-[#06060a] text-xs px-2.5 py-1.5 rounded text-white border border-gray-800">
                        <input type="text" id="inputUsername" value="${userProfile.username}" class="w-full bg-[#06060a] text-xs px-2.5 py-1.5 rounded text-white border border-gray-800">
                        <input type="date" id="inputDob" value="${userProfile.dob}" class="w-full bg-[#06060a] text-xs px-2.5 py-1.5 rounded text-white border border-gray-800">
                        <button onclick="saveProfileChanges()" class="gold-btn w-full py-2 rounded text-xs mt-1">Save Profile</button>
                    </div>

                    <div class="space-y-2 pt-2">
                        <button onclick="alert('Add account modal opened')" class="w-full py-2 bg-[#030305] text-xs rounded border border-gray-800 text-white hover:bg-gray-900">➕ Add Account</button>
                        <button onclick="alert('Logged out successfully')" class="w-full py-2 bg-red-950/40 text-xs rounded border border-red-900/50 text-red-400">🚪 Log Out</button>
                    </div>
                </div>`;
        }

        function toggleProfileEdit() {
            const form = document.getElementById('profileEditForm');
            form.style.display = form.style.display === 'block' ? 'none' : 'block';
        }

        function updateProfileAvatar(input) {
            if(input.files && input.files[0]) {
                userProfile.avatar = URL.createObjectURL(input.files[0]);
                document.getElementById('profileAvatarImg').src = userProfile.avatar;
            }
        }

        function saveProfileChanges() {
            userProfile.name = document.getElementById('inputFullName').value;
            userProfile.phone = document.getElementById('inputPhone').value;
            userProfile.username = document.getElementById('inputUsername').value;
            userProfile.dob = document.getElementById('inputDob').value;
            alert('Profile updated successfully!');
            renderProfileView();
        }

        function renderDeviceContacts() {
            const sortedContacts = [...deviceContacts].sort((a, b) => b.appUser - a.appUser);
            document.getElementById('sidebarContentList').innerHTML = sortedContacts.map(c => `
                <div onclick="openChatWithContact('${c.phone}', '${c.name}')" class="flex justify-between items-center p-3 hover:bg-[#030305] cursor-pointer transition">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center text-xs font-bold gold-gradient-text">${c.name.charAt(0)}</div>
                        <div>
                            <p class="text-xs font-medium gold-gradient-text">${c.name}</p>
                            <p class="text-[9px] text-[var(--success-green)]">${c.status}</p>
                        </div>
                    </div>
                    <div>
                        ${c.appUser ? '<span class="text-emerald-400 font-bold text-sm">✓</span>' : '<button onclick="event.stopPropagation(); alert(\'Invite sent!\')" class="text-[10px] px-2 py-1 bg-amber-500/20 text-amber-300 rounded border border-amber-500/30">Invite</button>'}
                    </div>
                </div>
            `).join('');
        }

        function renderChatStories() {
            document.getElementById('sidebarContentList').innerHTML = deviceContacts.filter(c => c.appUser).map(c => `
                <div onclick="openChatWithContact('${c.phone}', '${c.name}')" class="p-3 hover:bg-[#030305] cursor-pointer flex items-center space-x-3 transition">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" class="w-9 h-9 rounded-full object-cover">
                    <div class="flex-1 min-w-0">
                        <div class="flex justify-between items-baseline"><span class="font-medium text-xs gold-gradient-text truncate">${c.name}</span><span class="text-[9px] text-white opacity-80">salaam</span></div>
                        <p class="text-[10px] text-[var(--success-green)] truncate">Tap to open messages...</p>
                    </div>
                </div>
            `).join('');
        }

        function filterContent() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const items = document.querySelectorAll('#sidebarContentList > div');
            items.forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        function openChatWithContact(phone, name) {
            currentActiveRecipient = { phone, name };
            document.getElementById('activeChatHeader').style.display = 'flex';
            document.getElementById('chatInputBar').style.display = 'flex';
            document.getElementById('activeChatTitle').innerText = name;

            if(window.innerWidth < 768) {
                document.getElementById('sidebarSection').style.display = 'none';
                document.getElementById('workspaceSection').style.display = 'flex';
            }
            loadMessages();
        }

        function backToSidebarMobile() {
            document.getElementById('sidebarSection').style.display = 'flex';
            document.getElementById('workspaceSection').style.display = 'none';
        }

        function triggerCall(type) {
            if(!currentActiveRecipient) return;
            activeCallType = type;
            renderActiveCallScreen();
        }

        function renderActiveCallScreen() {
            const container = document.getElementById('chatMessages');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full space-y-4 bg-[#030305] p-6 rounded-2xl border border-amber-500/20">
                    <div class="w-20 h-20 rounded-full bg-gray-800 flex items-center justify-center text-3xl border-2 border-amber-500 animate-pulse gold-gradient-text">
                        ${activeCallType === 'audio' ? '📞' : '📹'}
                    </div>
                    <p class="text-sm font-bold gold-gradient-text">Connected</p>
                    <p class="text-xs text-white opacity-80">Talking with ${currentActiveRecipient.name}</p>
                    
                    <div class="flex space-x-3 pt-4 items-center">
                        <button onclick="switchCallMode()" class="px-4 py-2 bg-gray-800 text-xs rounded-lg text-amber-300 border border-amber-500/30 flex items-center space-x-1">
                            <span>Switch to ${activeCallType === 'audio' ? 'Video 📹' : 'Audio 📞'}</span>
                        </button>
                        <button onclick="endCallSession()" class="w-10 h-10 bg-red-600 rounded-full flex items-center justify-center text-white text-base shadow-lg hover:bg-red-500 transition" title="End Call">
                            📞
                        </button>
                    </div>
                </div>`;
        }

        function switchCallMode() {
            activeCallType = activeCallType === 'audio' ? 'video' : 'audio';
            renderActiveCallScreen();
        }

        function endCallSession() {
            loadMessages();
        }

        function toggleSendButton() {
            const text = document.getElementById('messageInput').value.trim();
            const sendBtn = document.getElementById('sendBtn');
            if(text.length > 0) sendBtn.classList.remove('hidden');
            else sendBtn.classList.add('hidden');
        }

        async function sendTextMessage() {
            if(!currentActiveRecipient) return;
            const text = document.getElementById('messageInput').value.trim();
            if(!text) return;

            await fetch('/api/chat?action=send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender_phone: userProfile.phone, recipient_phone: currentActiveRecipient.phone, message_text: text })
            });
            document.getElementById('messageInput').value = '';
            toggleSendButton();
            loadMessages();
        }

        function sendUniversalFile(inputElement) {
            if(!currentActiveRecipient || !inputElement.files[0]) return;
            const file = inputElement.files[0];
            const fileUrl = URL.createObjectURL(file);
            fetch('/api/chat?action=send_message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sender_phone: userProfile.phone, recipient_phone: currentActiveRecipient.phone, message_text: `[File: ${file.name}]`, media_url: fileUrl })
            }).then(() => { inputElement.value = ''; loadMessages(); });
        }

        async function loadMessages() {
            if(!currentActiveRecipient) return;
            const res = await fetch(`/api/chat?action=get_messages&user1=${userProfile.phone}&user2=${currentActiveRecipient.phone}`);
            const data = await res.json();
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            if(data.success && data.messages.length > 0) {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col";
                data.messages.forEach(msg => {
                    const isMe = msg.phone_number === userProfile.phone;
                    const div = document.createElement('div');
                    div.className = `max-w-xs p-2.5 rounded-xl text-xs ${isMe ? 'bg-[#122118] self-end text-white' : 'bg-[#06060a] self-start text-white'}`;
                    div.innerHTML = `<p>${msg.message_text}</p>` + (msg.avatar_url ? `<a href="${msg.avatar_url}" target="_blank" class="text-[var(--gold-solid)] underline block mt-1">[Open File]</a>` : '');
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } else {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center";
                container.innerHTML = `<div class="text-white opacity-70 text-xs text-center">No messages yet. Say salaam!</div>`;
            }
        }

        async function clearChatHistory() {
            if(!currentActiveRecipient) return;
            if(confirm('Clear chat history?')) {
                await fetch('/api/chat?action=clear_chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone_number: userProfile.phone, recipient_phone: currentActiveRecipient.phone })
                });
                loadMessages();
            }
        }

        window.onload = () => { switchTab('contact'); };
    </script>
</body>
</html>
