    <!-- আলাদা CSS ফাইল লিংক -->
    <link rel="stylesheet" href="/verify.css">

    <style>
        :root, [data-theme="black"] {
            --bg-main: #000000;
            --bg-surface: #070707;
            --bg-card: #0e0e0e;
            --bg-input: #121212;
            --bg-bubble-me: linear-gradient(135deg, rgba(28, 24, 16, 0.96) 0%, rgba(18, 15, 10, 0.96) 100%);
            --bg-bubble-them: rgba(20, 20, 20, 0.88);
            --bubble-border: rgba(245, 208, 97, 0.2);
            --gold-gradient: linear-gradient(135deg, #F5D061 0%, #FCF6BA 35%, #D4AF37 65%, #FBF5B7 85%, #AA771C 100%);
            --pink-solid: linear-gradient(135deg, #EC4899 0%, #ff2e7e 100%);
            --text-white: #ffffff;
            --text-gray: #9ca3af;
            --font-main: 'Poppins', sans-serif;
            --font-brand: 'Cinzel', serif;
        }
        [data-theme="emerald"] {
            --bg-main: #020d08;
            --bg-surface: #04120b;
            --bg-card: #071910;
            --bg-input: #091f15;
            --bg-bubble-me: linear-gradient(135deg, rgba(13, 46, 30, 0.96) 0%, rgba(7, 28, 18, 0.96) 100%);
            --bg-bubble-them: rgba(7, 22, 15, 0.88);
            --bubble-border: rgba(46, 213, 115, 0.22);
        }
        body { background-color: var(--bg-main); color: var(--text-white); font-family: var(--font-main); -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
        .theme-surface { background-color: var(--bg-surface); }
        .theme-card { background-color: var(--bg-card); }
        .theme-input { background-color: var(--bg-input); }
        .brand-title-font { font-family: var(--font-brand); letter-spacing: 0.16em; }
        .gold-gradient-text { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pink-gradient-text { background: var(--pink-solid); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-btn { background: var(--gold-gradient); color: #000000; font-weight: 600; }
        .gold-btn:hover { opacity: 0.92; }
        .pink-btn { background: var(--pink-solid); color: #ffffff; font-weight: 600; }
        .pink-btn:hover { opacity: 0.92; }
        
        /* টেক্সট সিলেকশন নিশ্চিত করা হয়েছে */
        .chat-bubble-me, .chat-bubble-them, .selectable-text {
            user-select: text !important;
            -webkit-user-select: text !important;
        }
        .chat-bubble-me { background: var(--bg-bubble-me); backdrop-filter: blur(12px); border: 1px solid var(--bubble-border); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); }
        .chat-bubble-them { background: var(--bg-bubble-them); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.07); box-shadow: 0 4px 18px rgba(0, 0, 0, 0.45); }
        
        @keyframes msgPopIn { 0% { opacity: 0; transform: translateY(14px) scale(0.96); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes listFadeIn { 0% { opacity: 0; transform: translateX(-8px); } 100% { opacity: 1; transform: translateX(0); } }
        @keyframes modalZoomIn { 0% { opacity: 0; transform: scale(0.92); } 100% { opacity: 1; transform: scale(1); } }
        .animate-msg { animation: msgPopIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .animate-list-item { animation: listFadeIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) both; }
        .animate-modal { animation: modalZoomIn 0.22s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

        /* শ্যাডো ও ইফেক্ট মুক্ত স্পষ্ট বড় লোগো */
        .header-logo-clean {
            width: 85px;
            height: 85px;
            object-fit: contain;
            background: transparent !important;
            filter: none !important;
            box-shadow: none !important;
            border: none !important;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden fixed inset-0">

    <!-- Mandatory Install & Secure Verify Overlay -->
    <div id="verifyOverlay" style="display: none;">
        <div class="verify-card animate-modal space-y-5 text-center">
            <div class="space-y-2.5">

                <div id="pwaInstallContainer" class="hidden pt-1">

                        <i class="fa-solid fa-download"></i><span>INSTALL APP TO CONTINUE</span>
                    </button>
                </div>
            </div>

            <!-- Step 1: Full Name & Mobile Number -->
            <div id="verifyStep1" class="space-y-4 text-left">
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text">FULL NAME <span class="text-red-500">*</span></label>
                    <input type="text" id="vFullName" placeholder="Enter your full name" oninput="this.value=this.value.replace(/[0-9]/g,'')" class="w-full theme-input text-xs px-4 py-3.5 rounded-xl text-white focus:outline-none border border-white/10">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text">MOBILE NUMBER <span class="text-red-500">*</span></label>
                    <div class="flex space-x-2">
                        <select id="vCountrySelect" onchange="updatePhoneValidation()" class="theme-input text-xs px-3 py-3.5 rounded-xl text-amber-300 font-bold focus:outline-none border border-white/10 cursor-pointer">
                            <option value="+880|10" selected>🇧🇩 +880 (BD)</option>
                            <option value="+91|10">🇮🇳 +91 (IN)</option>
                            <option value="+92|10">🇵🇰 +92 (PK)</option>
                            <option value="+966|9">🇸🇦 +966 (SA)</option>
                            <option value="+971|9">🇦🇪 +971 (AE)</option>
                            <option value="+1|10">🇺🇸 +1 (US)</option>
                            <option value="+44|10">🇬🇧 +44 (UK)</option>
                            <option value="+60|9">🇲🇾 +60 (MY)</option>
                            <option value="+65|8">🇸🇬 +65 (SG)</option>
                            <option value="+61|9">🇦🇺 +61 (AU)</option>
                            <option value="+974|8">🇶🇦 +974 (QA)</option>
                            <option value="+965|8">🇰🇼 +965 (KW)</option>
                        </select>
                        <input type="tel" id="vPhoneInput" placeholder="1700000000" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="flex-1 theme-input text-xs px-4 py-3.5 rounded-xl text-white focus:outline-none border border-white/10">
                    </div>
                </div>
                <button onclick="submitVerifyStep1()" id="btnSendCode" class="w-full py-3.5 gold-btn text-xs rounded-xl cursor-pointer mt-1 font-bold flex items-center justify-center space-x-2">
                    <span>SEND 6-DIGIT CODE</span> <i class="fa-solid fa-circle-check" style="color: #EC4899;"></i>
                </button>
            </div>

            <!-- Step 2: 6-Digit Code Verification -->
            <div id="verifyStep2" class="space-y-4 text-left hidden">
                <div class="text-center bg-black/60 p-4 rounded-2xl border border-amber-400/30 space-y-2">

                    <button onclick="autoFillOtp()" class="text-[11px] pink-gradient-text font-bold underline cursor-pointer hover:brightness-125">Auto-Verify Code</button>
                </div>
                <div class="space-y-1.5 text-center">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text block">ENTER 6-DIGIT CODE <span class="text-red-500">*</span></label>
                    <input type="text" id="vOtpInput" placeholder="000000" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full theme-input text-center text-lg font-extrabold tracking-[8px] px-4 py-3.5 rounded-xl text-white focus:outline-none border border-white/10">
                </div>
                <button onclick="submitVerifyStep2()" id="btnConfirmVerify" class="w-full py-3.5 gold-btn text-xs rounded-xl cursor-pointer mt-1 font-bold flex items-center justify-center space-x-2">
                    <span>AUTHORIZE & VERIFY</span> <i class="fa-solid fa-circle-check" style="color: #EC4899;"></i>
                </button>

        </div>

                    <div class="w-14 h-14 rounded-2xl theme-card flex items-center justify-center">

            </button>
            <button onclick="switchTab('chat')" id="tabChat" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 cursor-pointer focus:outline-none">
                <svg id="iconChat" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                <span id="labelChat" class="nav-label text-[10px] gold-gradient-text font-semibold">Chat</span>
            </button>
        </div>
    </nav>

    <!-- Modals (Notifications, Info, Call, Confirm, Toast) -->
    <div id="notificationModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="if(event.target === this) closeNotificationModal()">
        <div class="theme-card p-5 rounded-3xl max-w-sm w-full space-y-3.5 shadow-2xl border border-white/10 animate-modal">
            <div class="flex items-center justify-between pb-2 border-b border-white/10">
                <h3 class="text-xs font-bold gold-gradient-text flex items-center space-x-2"><span>Notifications</span><span id="modalNotifCountBadge" class="px-2 py-0.5 rounded-full pink-btn text-[9px]">0</span></h3>
                <div class="flex space-x-3">
                    <button onclick="clearAllNotifications()" class="text-[10px] text-pink-400 hover:underline cursor-pointer font-semibold">Clear All</button>
                    <button onclick="closeNotificationModal()" class="text-[10px] text-amber-300 hover:underline cursor-pointer font-semibold">Close</button>
                </div>
            </div>
            <div id="modalNotifList" class="space-y-2 max-h-60 overflow-y-auto"><p class="text-xs text-gray-400 text-center py-4">No notifications</p></div>
        </div>
    </div>

    <div id="recipientInfoModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4" onclick="if(event.target === this) closeRecipientInfoModal()">
        <div class="theme-card p-5 rounded-3xl max-w-xs w-full text-center space-y-3.5 shadow-2xl border border-white/10 animate-modal">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" class="w-16 h-16 rounded-full object-cover mx-auto border border-amber-400/30">
            <div>
                <h3 id="infoModalName" class="text-sm font-bold gold-gradient-text">Contact</h3>
                <p class="text-[10px] text-[#2ed573] mt-0.5 font-medium">Online</p>
            </div>
            <div id="infoModalPhoneContainer" class="theme-input px-3.5 py-2.5 rounded-2xl flex items-center justify-between"></div>
            <button onclick="closeRecipientInfoModal()" class="w-full py-2 bg-white/10 hover:bg-white/15 text-xs rounded-xl text-gray-300 cursor-pointer">Close</button>
        </div>
    </div>

    <div id="whatsAppCallModal" class="fixed inset-0 z-50 hidden flex-col justify-between bg-black/95 backdrop-blur-xl p-6">
        <div class="relative z-20 flex flex-col items-center text-center pt-6 space-y-2">
            <div class="flex items-center space-x-1.5 px-3 py-1 rounded-full bg-white/5"><span class="w-1.5 h-1.5 rounded-full bg-[#2ed573] animate-pulse"></span><span class="text-[10px] text-amber-200/90 tracking-widest uppercase font-semibold">End-to-End Encrypted</span></div>
            <h2 id="callPeerName" class="text-xl sm:text-2xl font-bold gold-gradient-text pt-2">Contact</h2>
            <p class="text-xs text-[#2ed573] font-medium">Ringing...</p>
        </div>
        <div class="relative z-20 flex flex-col items-center justify-center my-auto">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" class="w-28 h-28 rounded-full object-cover border-2 border-amber-400/40">
        </div>
        <div class="relative z-20 flex flex-col items-center pb-6 space-y-5">
            <div class="flex items-center justify-center space-x-6 theme-card px-6 py-3.5 rounded-3xl shadow-xl">
                <button onclick="endWhatsAppCall()" class="w-14 h-14 rounded-full pink-btn flex items-center justify-center transition cursor-pointer shadow-lg"><svg class="w-6 h-6 rotate-[135deg]" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
            </div>
        </div>
    </div>

    <div id="customConfirmModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="theme-card p-5 rounded-2xl max-w-[260px] w-full text-center space-y-3.5 shadow-2xl animate-modal">
            <p id="confirmModalText" class="text-xs text-white font-medium">Delete?</p>
            <div class="flex space-x-2">
                <button onclick="closeConfirmModal(false)" class="flex-1 py-2 bg-white/10 text-xs rounded-xl text-gray-300 hover:bg-white/15 cursor-pointer">Cancel</button>
                <button onclick="closeConfirmModal(true)" class="flex-1 py-2 pink-btn text-xs rounded-xl cursor-pointer">OK</button>
            </div>
        </div>
    </div>

    <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 theme-card text-white text-xs px-4 py-2 rounded-full shadow-2xl z-50 hidden items-center space-x-2 animate-modal">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-[#2ed573]"></span><span id="toastText">Done</span>
    </div>

    <!-- আলাদা JS ফাইল লিংক -->
    <script src="/verify.js"></script>
</body>
</html>
