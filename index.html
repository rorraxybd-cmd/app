<!DOCTYPE html>
<html lang="en" data-theme="emerald">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MESSAGE | rorraxy.com</title>
    <link rel="icon" type="image/png" href="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im1024.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#030305">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="stylesheet" href="/verify.css">
    <link rel="stylesheet" href="/discover.css?v=14.0">
    <style>
        :root {
            --bg-main: #030305;
            --surface: #070d0a;
            --card: #08110c;
            --gold-gradient: linear-gradient(135deg, #F5D061 0%, #FCF6BA 35%, #D4AF37 65%, #FBF5B7 85%, #AA771C 100%);
        }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-main); color: #ffffff; }
        .brand-title-font { font-family: 'Cinzel', serif; letter-spacing: 0.16em; }
        .gold-gradient-text { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pink-gradient-text { background: linear-gradient(135deg, #EC4899 0%, #ff2e7e 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .verify-card {
            background: linear-gradient(145deg, #08110c 0%, #030305 100%);
            border-radius: 32px;
            padding: 36px 28px;
            max-width: 440px;
            width: 100%;
            border: 1.5px solid rgba(245, 208, 97, 0.35);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
        }
        .gold-btn { background: var(--gold-gradient); color: #030305; font-weight: 700; box-shadow: 0 4px 15px rgba(245, 208, 97, 0.3); transition: transform 0.2s; }
        .gold-btn:hover { transform: scale(1.02); }
        .theme-surface { background-color: var(--surface); }
        .theme-card { background-color: var(--card); }
        .theme-input { background-color: rgba(255, 255, 255, 0.05); border: 1px solid rgba(245, 208, 97, 0.25); color: #fff; }
        
        .header-logo-clean {
            width: 96px;
            height: 96px;
            object-fit: cover;
            background: transparent !important;
            border-radius: 50%;
            box-shadow: none !important;
            filter: none !important;
            border: none !important;
        }
        #vCountrySelect {
            width: 155px;
            min-width: 140px;
            font-weight: 700;
        }
    </style>
</head>
<body class="h-[100dvh] w-full flex flex-col overflow-hidden fixed inset-0">

    <!-- Auto-Verify & Install Overlay -->
    <div id="verifyOverlay" style="display: flex;">
        <div class="verify-card space-y-5 text-center shadow-2xl">
            <div id="pwaInstallContainer" class="space-y-4">
                <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im1024.jpg" alt="Logo" class="header-logo-clean mx-auto">
                <h1 class="brand-title-font text-3xl font-extrabold gold-gradient-text">MESSAGE</h1>
                <p class="text-[11px] text-white/80 tracking-[0.25em] font-semibold uppercase">Private Global Messenger</p>
                <div class="pt-3 space-y-2">
                    <button onclick="handleCustomInstall()" class="gold-btn w-full py-4 rounded-xl text-xs font-extrabold tracking-wider shadow-lg inline-flex items-center justify-center space-x-2 cursor-pointer uppercase">
                        <i class="fa-solid fa-download"></i><span>INSTALL APP</span>
                    </button>
                    <button onclick="skipToProfileStep()" class="w-full py-2.5 text-xs text-amber-300/80 hover:text-amber-300 transition font-semibold cursor-pointer tracking-wider uppercase">
                        Already Installed? Continue →
                    </button>
                </div>
            </div>

            <div id="verifyStep1" class="space-y-4 text-left hidden">
                <div class="text-center pb-1">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im1024.jpg" alt="Logo" class="header-logo-clean mx-auto mb-2" style="width: 64px; height: 64px;">
                    <h2 class="brand-title-font text-2xl font-bold gold-gradient-text">Create Profile</h2>
                    <p class="text-[10px] text-white/70 tracking-widest uppercase mt-0.5">Enter your details to connect</p>
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text uppercase">FULL NAME <span class="text-pink-500">*</span></label>
                    <input type="text" id="vFullName" placeholder="Enter your full name" class="w-full theme-input text-xs px-4 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none">
                </div>
                <div class="space-y-1.5">
                    <label class="text-[10px] font-bold tracking-wider gold-gradient-text uppercase">MOBILE NUMBER <span class="text-pink-500">*</span></label>
                    <div class="flex space-x-2 w-full">
                        <select id="vCountrySelect" onchange="updatePhoneValidation()" class="theme-input text-xs px-2.5 py-3.5 rounded-xl text-amber-300 font-bold focus:outline-none cursor-pointer shrink-0"></select>
                        <input type="tel" id="vPhoneInput" placeholder="1700000000" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="flex-1 min-w-0 theme-input text-xs px-4 py-3.5 rounded-xl text-white placeholder-gray-500 focus:outline-none">
                    </div>
                </div>
                <button onclick="submitVerifyStep1()" class="w-full py-4 gold-btn text-xs rounded-xl cursor-pointer mt-2 font-extrabold flex items-center justify-center space-x-2 shadow-lg uppercase tracking-wider">
                    <span>CONTINUE</span> <i class="fa-solid fa-circle-check text-pink-600 text-sm"></i>
                </button>
            </div>

            <div id="verifyStep2" class="space-y-4 text-left hidden">
                <div class="space-y-2 text-center pt-2">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im1024.jpg" alt="Logo" class="header-logo-clean mx-auto mb-2" style="width: 64px; height: 64px;">
                    <h2 class="brand-title-font text-2xl font-bold gold-gradient-text">Verify Code</h2>
                    <label class="text-[11px] font-bold tracking-wider text-white block uppercase">AUTO-FILLED CODE <span class="text-emerald-400">✓</span></label>
                    <input type="text" id="vOtpInput" placeholder="000000" maxlength="6" oninput="this.value=this.value.replace(/[^0-9]/g,'')" class="w-full theme-input text-center text-2xl font-extrabold tracking-[12px] px-4 py-4 rounded-xl text-white focus:outline-none border border-amber-400/40 shadow-inner">
                </div>
                <button onclick="submitVerifyStep2()" class="w-full py-4 gold-btn text-xs rounded-xl cursor-pointer mt-3 font-extrabold flex items-center justify-center space-x-2 shadow-lg uppercase tracking-wider">
                    <span>VERIFY & START</span> <i class="fa-solid fa-circle-check text-pink-600 text-sm"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Header Bar -->
    <header class="theme-surface px-4 py-3 flex justify-between items-center shrink-0 z-30 border-b border-white/5">
        <div class="flex items-center space-x-3">
            <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im1024.jpg" alt="Logo" class="header-logo-clean" style="width: 42px; height: 42px;">
            <div>
                <div class="flex items-center space-x-1.5">
                    <h1 class="brand-title-font font-extrabold text-lg sm:text-xl gold-gradient-text leading-none">MESSAGE</h1>
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none"><path d="M12 2L14.8 4.2L18.3 4.3L19.5 7.6L22 10L20.8 13.3L21.5 16.8L18.3 18.4L16.7 21.5L13.3 20.8L10 22L7.6 19.5L4.3 18.3L4.2 14.8L2 12L4.2 9.2L4.3 5.7L7.6 4.5L10 2L12 2Z" fill="#F5D061"/><path d="M8.5 12.2L10.8 14.5L15.6 9.5" stroke="#030305" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <a href="https://rorraxy.com" target="_blank" class="text-[11px] text-white/70 hover:text-amber-300 transition block tracking-wider mt-0.5">rorraxy.com</a>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleNotificationPanel()" class="relative p-2.5 theme-card rounded-2xl hover:brightness-125 transition cursor-pointer border border-amber-400/20">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                <span id="headerNotifBadge" class="hidden absolute -top-1 -right-1 w-4 h-4 rounded-full pink-btn text-[9px] flex items-center justify-center font-bold">0</span>
            </button>
        </div>
    </header>

    <!-- Notification Dropdown Panel -->
    <div id="notificationPanel" class="hidden absolute right-4 top-16 w-80 max-w-[90vw] theme-card border border-amber-400/30 rounded-2xl shadow-2xl z-50 p-4 space-y-3">
        <div class="flex justify-between items-center border-b border-white/10 pb-2">
            <h3 class="text-xs font-bold gold-gradient-text uppercase tracking-wider">Notifications</h3>
            <div class="flex space-x-2">
                <button onclick="deleteAllNotifications()" class="text-[10px] text-red-400 hover:underline font-semibold cursor-pointer">Delete All</button>
                <button onclick="toggleNotificationPanel()" class="text-[10px] text-gray-400 hover:text-white cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
        </div>
        <div id="notificationListContainer" class="space-y-2 max-h-60 overflow-y-auto text-xs text-gray-300">
            <p class="text-center text-gray-500 py-4 text-[11px]">No new notifications</p>
        </div>
    </div>

    <!-- Main Workspace -->
    <div class="flex flex-1 overflow-hidden relative min-h-0 w-full">
        <div id="sidebarSection" class="w-full md:w-[360px] theme-surface flex flex-col justify-between shrink-0 z-20 h-full min-h-0 pb-16">
            <div class="flex flex-col flex-1 overflow-hidden min-h-0">
                <div id="searchBarContainer" class="p-3 shrink-0" style="background-color: var(--bg-main);">
                    <div class="flex items-center space-x-2 theme-input px-3.5 py-2.5 rounded-2xl">
                        <input type="text" id="searchInput" placeholder="Search name or dial number..." class="w-full bg-transparent text-xs focus:outline-none text-white placeholder-gray-500" oninput="filterContent()">
                        <button onclick="filterContent()" class="cursor-pointer p-1 shrink-0"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7.5" stroke="#F5D061" stroke-width="2.2"/><line x1="20.5" y1="20.5" x2="16.35" y2="16.35" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round"/></svg></button>
                    </div>
                </div>
                <div id="sidebarContentList" class="flex-1 overflow-y-auto space-y-1.5 p-3 pb-20"></div>
            </div>
        </div>

        <div id="workspaceSection" class="hidden md:flex flex-col flex-1 overflow-hidden h-full min-h-0 z-10 relative" style="background-color: var(--bg-main);">
            <div id="activeChatHeader" class="theme-surface px-4 py-3 hidden items-center justify-between shrink-0 border-b border-white/5">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebarMobile()" class="md:hidden p-1.5 rounded-xl theme-card cursor-pointer">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                    </button>
                    <div class="flex items-center space-x-3">
                        <div class="relative"><img id="activeChatAvatar" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im1024.jpg" class="w-9 h-9 header-logo-clean"></div>
                        <div>
                            <div class="flex items-center space-x-1.5">
                                <span id="activeChatTitle" class="font-semibold text-white text-xs tracking-wide">Select a contact</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="startWhatsAppCall('audio')" class="p-2 theme-card rounded-xl hover:brightness-125 transition cursor-pointer" title="Audio Call"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg></button>
                    <button onclick="startWhatsAppCall('video')" class="p-2 theme-card rounded-xl hover:brightness-125 transition cursor-pointer" title="Video Call"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2.5" ry="2.5"></rect></svg></button>
                    <button onclick="confirmClearChatHistory()" class="p-2 theme-card rounded-xl hover:bg-pink-950/20 transition cursor-pointer" title="Clear Chat"><svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg></button>
                </div>
            </div>

            <div id="chatMessages" class="flex-1 min-h-0 overflow-y-auto p-4 space-y-3 flex flex-col justify-start">
                <div class="flex flex-col items-center justify-center space-y-3 max-w-xs text-center m-auto">
                    <div class="w-14 h-14 rounded-2xl theme-card flex items-center justify-center border border-amber-400/20">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <p class="text-sm font-bold gold-gradient-text">Welcome to rorraxy MESSAGE</p>
                    <p class="text-[11px] text-gray-400">Select a contact or country to start messaging or calling.</p>
                </div>
            </div>

            <div id="chatInputBar" class="theme-surface px-3 py-2.5 hidden items-center shrink-0 z-20">
                <div class="flex-1 flex items-center theme-input rounded-2xl px-3.5 py-2 space-x-2.5">
                    <label class="cursor-pointer hover:scale-110 transition-transform flex items-center justify-center shrink-0" title="Attach File">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        <input type="file" id="universalFileInput" accept="image/*,video/*,audio/*,application/pdf,.doc,.docx,.zip,.txt" multiple class="hidden" onchange="handleUniversalFileUpload(this)">
                    </label>
                    <input type="text" id="messageInput" placeholder="Write a message..." class="flex-1 bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-1 min-w-0" oninput="toggleSendButton()" onkeypress="if(event.key === 'Enter') sendTextMessage()">
                    <button id="sendBtn" onclick="sendTextMessage()" class="hidden cursor-pointer hover:scale-110 transition-transform p-1 shrink-0 items-center justify-center">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

        <div class="flex items-center justify-around w-full px-3">
            <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-1.5 cursor-pointer focus:outline-none transition-transform hover:scale-110">
                <svg id="iconProfile" class="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06-.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                <span id="labelProfile" class="nav-label text-[9px] gold-gradient-text font-semibold">Settings</span>
            </button>
            <button onclick="switchTab('discover')" id="tabDiscover" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-1.5 cursor-pointer focus:outline-none transition-transform hover:scale-110">
                <svg id="iconDiscover" class="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="2" y1="12" x2="22" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
                <span id="labelDiscover" class="nav-label text-[9px] gold-gradient-text font-semibold">Discover</span>
            </button>

                <svg id="iconContact" class="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                <span id="labelContact" class="nav-label text-[9px] gold-gradient-text font-semibold">Contacts</span>
            </button>

                <svg id="iconChat" class="w-5 h-5 text-amber-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>

            </button>
        </div>
    </nav>

    <!-- Modals & Toasts -->
    <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 theme-card text-white text-xs px-4 py-2 rounded-full shadow-2xl z-50 hidden items-center space-x-2 border border-amber-400/30">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-[#2ed573]"></span><span id="toastText">Done</span>
    </div>

    <!-- Modular JavaScript Files Connection -->
    <script src="/discover.js?v=14.0"></script>
    <script src="/verify.js?v=14.0"></script>
    <script src="/call.js?v=14.0"></script>
    <script src="/message.js?v=14.0"></script>
    <script src="/transfer.js?v=14.0"></script>
    
    <script>
        // ট্যাব সুইচিং এবং পিঙ্ক/গোল্ড হাইলাইটিং লজিক
        function switchTab(tabName) {
            const tabs = ['Profile', 'Discover', 'Contact', 'Chat', 'Calls'];
            tabs.forEach(t => {
                const icon = document.getElementById('icon' + t);
                const label = document.getElementById('label' + t);
                if (icon) {
                    icon.classList.remove('text-[#EC4899]');
                    icon.classList.add('text-amber-300');
                    icon.style.stroke = '#F5D061';
                }
                if (label) {
                    label.classList.remove('pink-gradient-text', 'font-bold');
                    label.classList.add('gold-gradient-text', 'font-semibold');
                }
            });

            const activeKey = tabName.charAt(0).toUpperCase() + tabName.slice(1);
            const activeIcon = document.getElementById('icon' + activeKey);
            const activeLabel = document.getElementById('label' + activeKey);

            if (activeIcon) {
                activeIcon.classList.remove('text-amber-300');
                activeIcon.classList.add('text-[#EC4899]');
                activeIcon.style.stroke = '#EC4899';
            }
            if (activeLabel) {
                activeLabel.classList.remove('gold-gradient-text', 'font-semibold');
                activeLabel.classList.add('pink-gradient-text', 'font-bold');
            }

            // নির্দিষ্ট ট্যাবের জন্য সংশ্লিষ্ট মডিউল ফাংশন কল করা
            if (tabName === 'profile') {
                if (typeof renderProfileView === 'function') renderProfileView();
            } else if (tabName === 'discover') {
                if (typeof renderDiscoverDirectory === 'function') renderDiscoverDirectory();
            } else if (tabName === 'contact') {
                if (typeof renderContactsView === 'function') renderContactsView();
            } else if (tabName === 'chat') {
                if (typeof renderChatHistoryList === 'function') renderChatHistoryList();
            } else if (tabName === 'calls') {
                if (typeof renderCallsHistoryView === 'function') renderCallsHistoryView();
            }
        }

        function shareProfileLink() {
            const profile = typeof getActiveProfile === 'function' ? getActiveProfile() : { username: 'mrmasudar' };
            const profileUrl = `https://chat.rorraxy.com/${profile.username || 'user'}`;
            
            if (navigator.share) {
                navigator.share({
                    title: 'MESSAGE by rorraxy.com',
                    text: 'Connect with me on rorraxy MESSAGE',
                    url: profileUrl
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(profileUrl);
                if (typeof showToast === 'function') showToast("Profile link copied!");
            }
        }

        function showToast(text, isError = false) {
            const banner = document.getElementById('toastBanner');
            const toastText = document.getElementById('toastText');
            const toastDot = document.getElementById('toastDot');
            if (!banner || !toastText) return;
            
            toastText.innerText = text;
            if (toastDot) toastDot.style.backgroundColor = isError ? '#ff4757' : '#2ed573';
            banner.classList.remove('hidden');
            banner.style.display = 'flex';
            setTimeout(() => {
                banner.classList.add('hidden');
                banner.style.display = 'none';
            }, 3000);
        }

        function initAppAfterVerification() {
            const overlay = document.getElementById('verifyOverlay');
            if (overlay) overlay.style.display = 'none';
            switchTab('contact');
            if (typeof startIncomingCallPolling === 'function') {
                startIncomingCallPolling();
            }
        }

        function loadCountryCodesIntoSelect() {
            const selectEl = document.getElementById('vCountrySelect');
            if (!selectEl) return;
            selectEl.innerHTML = '';
            if (typeof GLOBAL_CONTINENTS_DATA !== 'undefined') {
                GLOBAL_CONTINENTS_DATA.forEach(continent => {
                    continent.countries.forEach(country => {
                        const option = document.createElement('option');
                        option.value = country.code;
                        option.textContent = `${country.flag} +${country.code} (${country.name})`;
                        if (country.name === 'Bangladesh') {
                            option.selected = true;
                        }
                        selectEl.appendChild(option);
                    });
                });
            }
        }

        function handleCustomInstall() {
            if (typeof installPWAApp === 'function') {
                installPWAApp();
            }
            skipToProfileStep();
        }

        function skipToProfileStep() {
            const installContainer = document.getElementById('pwaInstallContainer');
            const step1 = document.getElementById('verifyStep1');
            if (installContainer) installContainer.classList.add('hidden');
            if (step1) {
                step1.classList.remove('hidden');
                loadCountryCodesIntoSelect();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const overlay = document.getElementById('verifyOverlay');
            if (localStorage.getItem('salaam_verified_v18') === 'true') {
                if (overlay) overlay.style.display = 'none';
                initAppAfterVerification();
            } else {
                if (overlay) overlay.style.display = 'flex';
                const installContainer = document.getElementById('pwaInstallContainer');
                const step1 = document.getElementById('verifyStep1');
                const step2 = document.getElementById('verifyStep2');
                if (installContainer) installContainer.classList.remove('hidden');
                if (step1) step1.classList.add('hidden');
                if (step2) step2.classList.add('hidden');
                loadCountryCodesIntoSelect();
                if (typeof checkInitialVerification === 'function') {
                    checkInitialVerification();
                }
            }
        });
    </script>
</body>
</html>
