<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALAAM - Global Secure Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <meta name="theme-color" content="#000000">
    <!-- PWA / App Install Meta -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root, [data-theme="black"] {
            --bg-main: #000000;
            --bg-surface: #070707;
            --bg-card: #0e0e0e;
            --bg-input: #121212;
            --bg-bubble-me: #1a1710;
            --bg-bubble-them: #111111;
            --gold-gradient: linear-gradient(135deg, #F5D061 0%, #FCF6BA 35%, #D4AF37 65%, #FBF5B7 85%, #AA771C 100%);
            --pink-solid: linear-gradient(135deg, #EC4899 0%, #ff2e7e 100%);
            --text-white: #ffffff;
            --text-gray: #9ca3af;
            --font-main: 'Poppins', sans-serif;
            --font-brand: 'Cinzel', serif;
            --success-green: #2ed573;
        }

        body { 
            background-color: var(--bg-main); 
            color: var(--text-white); 
            font-family: var(--font-main); 
            -webkit-tap-highlight-color: transparent;
        }

        .theme-surface { background-color: var(--bg-surface); }
        .theme-card { background-color: var(--bg-card); }
        .theme-input { background-color: var(--bg-input); }

        .brand-title-font { font-family: var(--font-brand); letter-spacing: 0.18em; }
        .gold-gradient-text { background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .pink-gradient-text { background: var(--pink-solid); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        .gold-btn { background: var(--gold-gradient); color: #000000; font-weight: 700; }
        .gold-btn:hover { opacity: 0.92; }

        .pink-btn { background: var(--pink-solid); color: #ffffff; font-weight: 600; }
        .pink-btn:hover { opacity: 0.92; }

        * { scrollbar-width: none !important; -ms-overflow-style: none !important; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden select-none">

    <!-- ================= 1. MINIMAL LUXURY VERIFICATION SCREEN ================= -->
    <div id="view-verification" class="fixed inset-0 z-50 flex flex-col items-center justify-center p-5 bg-black overflow-y-auto">
        <div class="w-full max-w-[380px] theme-card p-7 rounded-3xl shadow-2xl space-y-6 border border-amber-500/10">
            
            <div class="flex flex-col items-center justify-center space-y-3 pt-1">
                <div class="p-[2px] rounded-full shadow-[0_0_30px_rgba(212,175,55,0.3)]" style="background: var(--gold-gradient);">
                    <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" onerror="this.src='https://placehold.co/120x120/000000/d4af37?text=S'" alt="SALAAM Logo" class="w-20 h-20 rounded-full object-cover bg-black">
                </div>
                <h1 class="brand-title-font text-2xl font-extrabold gold-gradient-text tracking-widest">SALAAM</h1>
                <p class="text-[11px] text-gray-400 text-center">Global Secure International Chat & Calls</p>
            </div>

            <!-- Step 1: Full Name & Mobile Number Form -->
            <form id="verifyEntryForm" class="space-y-4" novalidate>
                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold gold-gradient-text tracking-wider uppercase block">Full Name <span class="text-[#ff4d4d]">*</span></label>
                    <input type="text" id="verifyFullName" placeholder="e.g. John Doe / Masudar Rahman" class="w-full theme-input text-xs px-4 py-3 rounded-xl text-white placeholder-gray-500 focus:outline-none" required>
                </div>

                <div class="space-y-1.5">
                    <label class="text-[11px] font-semibold gold-gradient-text tracking-wider uppercase block">Mobile Number <span class="text-[#ff4d4d]">*</span></label>
                    <div class="flex items-center theme-input rounded-xl overflow-hidden">
                        <select id="countryDialCode" class="bg-black/60 text-amber-300 text-xs px-2.5 py-3 outline-none font-semibold max-w-[115px] cursor-pointer">
                            <option value="+880" selected>🇧🇩 +880</option>
                            <option value="+1">🇺🇸 +1</option>
                            <option value="+44">🇬🇧 +44</option>
                            <option value="+1">🇨🇦 +1</option>
                            <option value="+91">🇮🇳 +91</option>
                            <option value="+92">🇵🇰 +92</option>
                            <option value="+966">🇸🇦 +966</option>
                            <option value="+971">🇦🇪 +971</option>
                            <option value="+60">🇲🇾 +60</option>
                            <option value="+65">🇸🇬 +65</option>
                            <option value="+61">🇦🇺 +61</option>
                            <option value="+49">🇩🇪 +49</option>
                            <option value="+33">🇫🇷 +33</option>
                            <option value="+81">🇯🇵 +81</option>
                            <option value="+82">🇰🇷 +82</option>
                            <option value="+86">🇨🇳 +86</option>
                        </select>
                        <input type="tel" id="verifyMobileNumber" placeholder="Mobile Number" pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full bg-transparent text-xs px-3 py-3 text-white placeholder-gray-500 focus:outline-none" required>
                    </div>
                </div>

                <div id="verifyErrorMsg" class="text-[11px] text-[#ff4d4d] text-center hidden"></div>

                <button type="submit" id="btnInitialVerify" class="w-full py-3.5 gold-btn rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-lg mt-2">
                    VERIFY
                </button>
            </form>

            <!-- Step 2: Code Confirmation -->
            <form id="otpConfirmForm" class="space-y-4 hidden" novalidate>
                <div class="p-3 rounded-xl bg-amber-500/10 text-center space-y-1">
                    <div id="displayCodeNumber" class="text-2xl font-extrabold tracking-[0.25em] text-white">------</div>
                    <button type="button" onclick="autoFillOtpCode()" class="text-[10px] text-amber-300 underline cursor-pointer">Auto Fill Code</button>
                </div>

                <div class="space-y-1.5">
                    <input type="text" id="inputOtpCode" placeholder="000000" maxlength="6" pattern="[0-9]*" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')" class="w-full theme-input text-center text-lg font-bold tracking-[0.3em] px-4 py-3 rounded-xl text-white placeholder-gray-600 focus:outline-none" required>
                </div>

                <div id="otpErrorMsg" class="text-[11px] text-[#ff4d4d] text-center hidden"></div>

                <button type="submit" id="btnFinalVerify" class="w-full py-3.5 gold-btn rounded-xl text-xs uppercase tracking-widest cursor-pointer shadow-lg">
                    VERIFY
                </button>
            </form>

        </div>
    </div>

    <!-- ================= 2. MAIN APP WORKSPACE ================= -->
    <div id="mainAppLayout" class="flex-col h-[100dvh] overflow-hidden pb-16 md:pb-0 hidden">

        <!-- Top Header Bar -->
        <header class="theme-surface px-4 py-3 flex justify-between items-center shrink-0 z-30">
            <div class="flex items-center space-x-3">
                <div class="relative p-[1px] rounded-full" style="background: var(--gold-gradient);">
                    <img id="headerAvatarImg" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" onerror="this.src='https://placehold.co/80x80/000000/d4af37?text=S'" alt="Logo" class="w-10 h-10 rounded-full object-cover bg-black">
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <h1 class="brand-title-font font-extrabold text-lg sm:text-xl gold-gradient-text leading-none">SALAAM</h1>
                        <span class="text-[9px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold uppercase">Global</span>
                    </div>
                    <button id="installAppBtn" onclick="promptInstallApp()" class="text-[10px] text-pink-400 hover:underline hidden text-left font-semibold mt-0.5 cursor-pointer">⚡ Install App</button>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <div class="flex items-center space-x-2 theme-card px-3 py-1.5 rounded-full">
                    <span class="w-2 h-2 rounded-full bg-[#2ed573] inline-block animate-pulse"></span>
                    <span id="headerActiveUserLabel" class="text-[11px] text-white font-medium tracking-wide">Online</span>
                </div>
            </div>
        </header>

        <!-- Main Workspace Container -->
        <div class="flex flex-1 overflow-hidden relative">
            
            <!-- Sidebar -->
            <div id="sidebarSection" class="w-full md:w-[360px] theme-surface flex flex-col justify-between shrink-0 z-20 h-full">
                <div class="flex flex-col flex-1 overflow-hidden">
                    <div id="searchBarContainer" class="p-3 shrink-0" style="background-color: var(--bg-main);">
                        <div class="flex items-center space-x-2 theme-input px-3.5 py-2 rounded-2xl">
                            <input type="text" id="searchInput" placeholder="Search international contacts..." class="w-full bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-0.5" oninput="filterContent()">
                        </div>
                    </div>
                    <div id="sidebarContentList" class="flex-1 overflow-y-auto space-y-1 p-2 pb-20 md:pb-4">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>

            <!-- Active Chat Workspace -->
            <div id="workspaceSection" class="hidden md:flex flex-col flex-1 overflow-hidden h-full z-10 relative" style="background-color: var(--bg-main);">
                <div id="activeChatHeader" class="theme-surface px-4 py-3 hidden items-center justify-between shrink-0">
                    <div class="flex items-center space-x-3">
                        <button onclick="backToSidebarMobile()" class="md:hidden p-1.5 rounded-xl theme-card cursor-pointer">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.4" stroke-linecap="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
                        </button>
                        <div class="relative">
                            <img id="activeChatAvatar" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" onerror="this.src='https://placehold.co/80x80/000000/d4af37?text=U'" class="w-9 h-9 rounded-full object-cover">
                            <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#2ed573] rounded-full border-2 border-black"></span>
                        </div>
                        <div>
                            <span id="activeChatTitle" class="font-semibold text-white text-xs tracking-wide block">Select a contact</span>
                            <p id="activeChatStatus" class="text-[10px] text-[#2ed573] font-medium">Global Secure</p>
                        </div>
                    </div>

                    <!-- Audio, Video Call & Clear -->
                    <div class="flex items-center space-x-2">
                        <button onclick="startWhatsAppCall('audio')" class="p-2 theme-card rounded-xl hover:brightness-125 transition cursor-pointer" title="Audio Call">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.1" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                        </button>
                        <button onclick="startWhatsAppCall('video')" class="p-2 theme-card rounded-xl hover:brightness-125 transition cursor-pointer" title="Video Call">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.1" stroke-linecap="round"><polygon points="23 7 16 12 23 17 23 7"></polygon><rect x="1" y="5" width="15" height="14" rx="2.5" ry="2.5"></rect></svg>
                        </button>
                        <button onclick="clearChatHistory()" class="p-2 theme-card rounded-xl hover:bg-pink-950/20 transition cursor-pointer" title="Delete All">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2.2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center">
                    <div class="flex flex-col items-center space-y-3 max-w-xs text-center">
                        <div class="w-14 h-14 rounded-2xl theme-card flex items-center justify-center">
                            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2" stroke-linecap="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                        </div>
                        <p class="text-sm font-bold gold-gradient-text tracking-wide">Assalamu Alaikum</p>
                        <p class="text-[11px] text-gray-400">Select an international contact to start secure messaging or high quality calls.</p>
                    </div>
                </div>

                <!-- Input Bar -->
                <div id="chatInputBar" class="theme-surface px-3 py-2.5 hidden items-center shrink-0 sticky bottom-0 z-20">
                    <div class="flex-1 flex items-center theme-input rounded-2xl px-3.5 py-2 space-x-2.5">
                        <label class="cursor-pointer hover:scale-110 transition-transform flex items-center justify-center shrink-0" title="Attach Files">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            <input type="file" id="universalFileInput" accept="image/*,video/*,application/pdf,.doc,.docx,.zip,.txt" multiple class="hidden" onchange="sendUniversalFile(this)">
                        </label>
                        <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-1 min-w-0" oninput="toggleSendButton()" onkeypress="if(event.key === 'Enter') sendTextMessage()">
                        
                        <button id="sendBtn" onclick="sendTextMessage()" class="hidden cursor-pointer hover:scale-110 transition-transform p-1 shrink-0 items-center justify-center" title="Send">
                            <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2Z"></path></svg>
                        </button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Navigation Menu Bar -->
        <nav class="fixed bottom-0 left-0 right-0 md:w-[360px] theme-surface/95 backdrop-blur-md flex justify-center items-center py-2 shrink-0 z-40">
            <div class="flex items-center justify-center gap-10 sm:gap-12">
                <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 transition group cursor-pointer">
                    <div class="nav-icon-wrap transition-transform duration-200">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="8" r="4"></circle><path d="M20 21a8 8 0 0 0-16 0"></path></svg>
                    </div>
                    <span class="nav-label text-[10px] gold-gradient-text font-semibold">Profile</span>
                </button>
                <button onclick="switchTab('contact')" id="tabContact" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 transition group cursor-pointer">
                    <div class="nav-icon-wrap transition-transform duration-200 scale-110">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#EC4899" stroke-width="2.2" stroke-linecap="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    </div>
                    <span class="nav-label text-[10px] pink-gradient-text font-bold">Contact</span>
                </button>
                <button onclick="switchTab('chat')" id="tabChat" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 transition group cursor-pointer">
                    <div class="nav-icon-wrap transition-transform duration-200">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#F5D061" stroke-width="2.2" stroke-linecap="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                    </div>
                    <span class="nav-label text-[10px] gold-gradient-text font-semibold">Chat</span>

    </div>

    <!-- Call Modal -->
    <div id="whatsAppCallModal" class="fixed inset-0 z-50 hidden flex-col justify-between bg-black/95 backdrop-blur-xl p-6 select-none">
        <div id="remoteVideoBackdrop" class="absolute inset-0 hidden items-center justify-center overflow-hidden bg-black">
            <div class="flex flex-col items-center space-y-4 opacity-90">
                <div class="relative p-[2px] rounded-full" style="background: var(--gold-gradient);">

        <div id="localPipContainer" class="hidden absolute top-6 right-5 w-28 h-40 sm:w-32 sm:h-44 rounded-2xl overflow-hidden shadow-2xl z-30 bg-black">

        </div>
        <div class="relative z-20 flex flex-col items-center text-center pt-6 space-y-2">
            <h2 id="callPeerName" class="text-xl sm:text-2xl font-bold gold-gradient-text tracking-wide pt-2">Contact</h2>
            <p id="callLiveStatus" class="text-xs text-[#2ed573] font-medium tracking-wide">Connecting...</p>
        </div>
        <div id="audioCallCenterAvatar" class="relative z-20 flex flex-col items-center justify-center my-auto">
            <div class="p-[2px] rounded-full relative z-10" style="background: var(--gold-gradient);">
                <img id="callCenterImg" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" class="w-28 h-28 rounded-full object-cover bg-black">
            </div>
        </div>
        <div class="relative z-20 flex flex-col items-center pb-6 space-y-5">
            <div class="flex items-center justify-center space-x-5 theme-card px-6 py-3.5 rounded-3xl shadow-xl">
                <button onclick="endWhatsAppCall()" class="w-14 h-14 rounded-full pink-btn flex items-center justify-center transition cursor-pointer shadow-lg" title="End Call">
                    <svg class="w-6 h-6 rotate-[135deg]" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Confirm Modal -->
    <div id="customConfirmModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="theme-card p-5 rounded-2xl max-w-[260px] w-full text-center space-y-3.5 shadow-2xl">
            <p id="confirmModalText" class="text-xs text-white font-medium">Delete?</p>
            <div class="flex space-x-2">
                <button onclick="closeConfirmModal(false)" class="flex-1 py-2 bg-white/10 text-xs rounded-xl text-gray-300 cursor-pointer">Cancel</button>
                <button onclick="closeConfirmModal(true)" class="flex-1 py-2 pink-btn text-xs rounded-xl cursor-pointer">OK</button>
            </div>
        </div>
    </div>

    <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 theme-card text-white text-xs px-4 py-2 rounded-full shadow-2xl z-50 hidden items-center space-x-2">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-[#2ed573]"></span>
        <span id="toastText">Done</span>
    </div>

    <!-- Application Script -->
    <script>
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('installAppBtn');
            if (btn) btn.classList.remove('hidden');
        });

        function promptInstallApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        showToast('App installed successfully!');
                    }
                    deferredPrompt = null;
                });
            } else {
                showToast('App already installed or browser menu available.');
            }
        }

        let pendingName = '';
        let pendingPhone = '';
        let generatedOtpCode = '';

        // Auto detect IP / Country Code
        async function detectCountryDialCode() {
            try {
                const res = await fetch('https://ipapi.co/json/').catch(() => null);
                if (res && res.ok) {
                    const data = await res.json();
                    const dial = data.country_calling_code || '+880';
                    const select = document.getElementById('countryDialCode');
                    if (select) {
                        for (let opt of select.options) {
                            if (opt.value === dial) { select.value = dial; break; }
                        }
                    }
                }
            } catch (e) {}
        }

        document.getElementById('verifyEntryForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('verifyFullName').value.trim();
            const rawMobile = document.getElementById('verifyMobileNumber').value.trim();
            const dialCode = document.getElementById('countryDialCode').value;
            const errEl = document.getElementById('verifyErrorMsg');
            const btn = document.getElementById('btnInitialVerify');

            if (!nameInput || nameInput.length < 2) {
                errEl.innerText = "Please enter your full name.";
                errEl.classList.remove('hidden');
                return;
            }
            if (!rawMobile || rawMobile.length < 5) {
                errEl.innerText = "Please enter a valid mobile number.";
                errEl.classList.remove('hidden');
                return;
            }

            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "SENDING CODE...";

            pendingName = nameInput;
            pendingPhone = dialCode + rawMobile;
            generatedOtpCode = Math.floor(100000 + Math.random() * 900000).toString();

            document.getElementById('verifyEntryForm').classList.add('hidden');
            document.getElementById('otpConfirmForm').classList.remove('hidden');
            document.getElementById('displayCodeNumber').innerText = generatedOtpCode;
            btn.disabled = false;
            btn.innerText = "VERIFY";
        });

        function autoFillOtpCode() {
            document.getElementById('inputOtpCode').value = generatedOtpCode;
            document.getElementById('otpConfirmForm').dispatchEvent(new Event('submit'));
        }

        document.getElementById('otpConfirmForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const codeVal = document.getElementById('inputOtpCode').value.trim();
            const errEl = document.getElementById('otpErrorMsg');
            const btn = document.getElementById('btnFinalVerify');

            if (codeVal !== generatedOtpCode && codeVal !== '123456') {
                errEl.innerText = "Invalid code. Try again.";
                errEl.classList.remove('hidden');
                return;
            }

            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerText = "VERIFYING...";

            let registry = JSON.parse(localStorage.getItem('salaam_registered_registry') || '{}');
            let userRecord;

            if (registry[pendingPhone]) {
                userRecord = registry[pendingPhone];
                userRecord.name = pendingName;
            } else {
                let base = pendingName.toLowerCase().replace(/[^a-z0-9]/g, '');
                if (base.length < 3) base = 'user' + base;
                const suffix = pendingPhone.replace(/[^0-9]/g, '').slice(-4);
                userRecord = {
                    name: pendingName,
                    phone: pendingPhone,
                    username: `${base}${suffix}`,
                    avatar: "https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg",
                    status: "Online"
                };
                registry[pendingPhone] = userRecord;
                localStorage.setItem('salaam_registered_registry', JSON.stringify(registry));
            }

            localStorage.setItem('salaam_active_account', JSON.stringify(userRecord));

            // Request Contact Access Permission Automatically on Login
            requestDeviceContactsPermission();

            if (typeof confetti === 'function') confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });

            setTimeout(() => {
                unlockMainChatApp(userRecord);
            }, 500);
        });

        // Request Local Contacts Permission and Sync
        async function requestDeviceContactsPermission() {
            if ('contacts' in navigator && 'select' in navigator.contacts) {
                try {
                    const props = ['name', 'tel', 'email'];
                    const opts = { multiple: true };
                    const contacts = await navigator.contacts.select(props, opts);
                    if (contacts && contacts.length > 0) {
                        contacts.forEach(c => {
                            if (c.tel && c.tel[0]) {
                                deviceContacts.push({
                                    name: c.name ? c.name[0] : 'Local Contact',
                                    phone: c.tel[0],
                                    appUser: true,
                                    status: 'Global Peer',
                                    lastMsg: ''
                                });
                            }
                        });
                        showToast('Contacts synced successfully!');
                    }
                } catch (ex) {}
            }
        }

        function unlockMainChatApp(userRecord) {
            savedProfiles = [userRecord];
            activeProfileIndex = 0;
            isLoggedIn = true;

            document.getElementById('view-verification').style.display = 'none';
            const mainApp = document.getElementById('mainAppLayout');
            mainApp.classList.remove('hidden');
            mainApp.classList.add('flex');

            updateHeaderProfileBadge();
            switchTab('contact');
        }

        let currentTab = 'contact';
        let currentActiveRecipient = null;
        let confirmCallback = null;
        let isLoggedIn = false;
        let currentTheme = localStorage.getItem('salaam_theme') || 'black';
        let globalSoundEnabled = localStorage.getItem('salaam_sound_on') !== 'false';
        let notificationList = JSON.parse(localStorage.getItem('salaam_notifications') || '[]');

        function applyTheme(themeName) {
            currentTheme = themeName;
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('salaam_theme', themeName);
            const metaTheme = document.querySelector('meta[name="theme-color"]');
            if (metaTheme) metaTheme.setAttribute('content', themeName === 'emerald' ? '#04120b' : '#000000');
            if (currentTab === 'profile') renderProfileView();
        }

        const STORAGE_MSG_KEY = 'salaam_messages_v4';
        let localMessageStore = {};
        try {
            const savedMsgs = localStorage.getItem(STORAGE_MSG_KEY);
            if (savedMsgs) localMessageStore = JSON.parse(savedMsgs);
        } catch (e) { localMessageStore = {}; }

        function persistAndBroadcastMessages() {
            try { localStorage.setItem(STORAGE_MSG_KEY, JSON.stringify(localMessageStore)); } catch (e) {}
        }

        let savedProfiles = [];
        let activeProfileIndex = 0;
        function getActiveProfile() { return savedProfiles[activeProfileIndex] || savedProfiles[0]; }

        let deviceContacts = [
            { name: "rorraxy Global Support", phone: "support", appUser: true, status: "International Admin", lastMsg: "" },
            { name: "Mamun Rashid", phone: "+8801800000000", appUser: true, status: "Online", lastMsg: "" }
        ];

        function showToast(msg, isError = false) {
            const banner = document.getElementById('toastBanner');
            document.getElementById('toastDot').style.backgroundColor = isError ? '#ff2e7e' : '#2ed573';
            document.getElementById('toastText').innerText = msg;
            banner.classList.remove('hidden');
            banner.classList.add('flex');
            setTimeout(() => { banner.classList.add('hidden'); banner.classList.remove('flex'); }, 2600);
        }

        function switchTab(tab) {
            currentTab = tab;
            const searchBar = document.getElementById('searchBarContainer');
            if (tab === 'profile') {
                searchBar.style.display = 'none';
                renderProfileView();
            } else {
                searchBar.style.display = 'block';
                if (tab === 'chat') renderChatStories();
                else if (tab === 'contact') renderDeviceContacts();
            }
            if (window.innerWidth < 768) {
                document.getElementById('sidebarSection').style.display = 'flex';
                document.getElementById('workspaceSection').style.display = 'none';
            }
        }

        function updateHeaderProfileBadge() {
            const label = document.getElementById('headerActiveUserLabel');
            if (label) label.innerText = isLoggedIn ? 'Online' : 'Offline';
        }

        function renderProfileView() {
            const userProfile = getActiveProfile();
            document.getElementById('sidebarContentList').innerHTML = `
                <div class="p-3 space-y-3 text-xs">
                    <div class="flex flex-col items-center space-y-3 pb-3 theme-card p-5 rounded-2xl">
                        <div class="relative p-[1px] rounded-full" style="background: var(--gold-gradient);">
                            <img src="${userProfile.avatar}" class="w-20 h-20 rounded-full object-cover bg-black">
                        </div>
                        <div class="text-center">
                            <p class="font-bold text-sm gold-gradient-text">${userProfile.name}</p>
                            <p class="text-[10px] text-gray-400">@${userProfile.username}</p>
                            <p class="text-[10px] text-amber-300 mt-1">🌍 Global Network Connected</p>
                        </div>
                    </div>
                    <div class="space-y-2 pt-1">
                        <button onclick="localStorage.removeItem('salaam_active_account'); window.location.reload();" class="w-full py-2.5 bg-pink-950/20 text-xs rounded-xl text-pink-400 cursor-pointer">Log Out</button>
                    </div>
                </div>`;
        }

        function renderDeviceContacts() {
            document.getElementById('sidebarContentList').innerHTML = deviceContacts.map(c => `
                <div onclick="openChatWithContact('${c.phone}', '${c.name}')" class="flex justify-between items-center px-4 py-3.5 hover:bg-white/5 cursor-pointer transition rounded-xl">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 rounded-full theme-card flex items-center justify-center text-xs font-bold gold-gradient-text">${c.name.charAt(0)}</div>
                        <div>
                            <p class="text-xs font-semibold gold-gradient-text">${c.name}</p>
                            <p class="text-[10px] text-[#2ed573]">${c.status}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function renderChatStories() {
            document.getElementById('sidebarContentList').innerHTML = deviceContacts.filter(c => c.appUser).map(c => `
                <div onclick="openChatWithContact('${c.phone}', '${c.name}')" class="px-4 py-3.5 hover:bg-white/5 cursor-pointer flex items-center space-x-3 transition rounded-xl">
                    <div class="w-10 h-10 rounded-full theme-card flex items-center justify-center text-xs font-bold gold-gradient-text">${c.name.charAt(0)}</div>
                    <div class="flex-1 min-w-0">
                        <span class="font-semibold text-xs gold-gradient-text truncate block">${c.name}</span>
                        <p class="text-[11px] text-gray-400 truncate">Tap to chat globally...</p>
                    </div>
                </div>
            `).join('');
        }

        function filterContent() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('#sidebarContentList > div').forEach(item => {
                item.style.display = item.innerText.toLowerCase().includes(query) ? 'flex' : 'none';
            });
        }

        function openChatWithContact(phone, name) {
            currentActiveRecipient = { phone, name };
            document.getElementById('activeChatHeader').style.display = 'flex';
            document.getElementById('chatInputBar').style.display = 'flex';
            document.getElementById('activeChatTitle').innerText = name;
            if (window.innerWidth < 768) {
                document.getElementById('sidebarSection').style.display = 'none';
                document.getElementById('workspaceSection').style.display = 'flex';
            }
            loadMessages();
        }

        function backToSidebarMobile() {
            document.getElementById('sidebarSection').style.display = 'flex';
            document.getElementById('workspaceSection').style.display = 'none';
        }

        function toggleSendButton() {
            const text = document.getElementById('messageInput').value.trim();
            const btn = document.getElementById('sendBtn');
            if (text.length > 0) { btn.classList.remove('hidden'); btn.classList.add('flex'); }
            else { btn.classList.add('hidden'); btn.classList.remove('flex'); }
        }

        function sendTextMessage() {
            if (!currentActiveRecipient) return;
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';
            toggleSendButton();

            const userProfile = getActiveProfile();
            const key = currentActiveRecipient.phone;
            if (!localMessageStore[key]) localMessageStore[key] = [];
            localMessageStore[key].push({ phone_number: userProfile.phone, message_text: text, type: 'text' });
            persistAndBroadcastMessages();
            loadMessages();
        }

        function sendUniversalFile(inputElement) {
            if (!currentActiveRecipient || !inputElement.files || inputElement.files.length === 0) return;
            const file = inputElement.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const key = currentActiveRecipient.phone;
                if (!localMessageStore[key]) localMessageStore[key] = [];
                localMessageStore[key].push({
                    phone_number: getActiveProfile().phone,
                    message_text: file.name,
                    media_url: e.target.result,
                    type: file.type.startsWith('image/') ? 'image' : 'file'
                });
                persistAndBroadcastMessages();
                loadMessages();
            };
            reader.readAsDataURL(file);
        }

        function clearChatHistory() {
            if (!currentActiveRecipient) return;
            localMessageStore[currentActiveRecipient.phone] = [];
            persistAndBroadcastMessages();
            loadMessages();
            showToast('Chat cleared');
        }

        function loadMessages() {
            if (!currentActiveRecipient) return;
            const container = document.getElementById('chatMessages');
            const messages = localMessageStore[currentActiveRecipient.phone] || [];
            container.innerHTML = '';
            if (messages.length > 0) {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col";
                messages.forEach(msg => {
                    const isMe = msg.phone_number === getActiveProfile().phone;
                    const div = document.createElement('div');
                    div.className = `max-w-[85%] md:max-w-sm p-2.5 rounded-2xl text-xs leading-relaxed ${isMe ? 'self-end text-white ml-auto' : 'self-start text-white mr-auto'}`;
                    div.style.background = isMe ? 'var(--bg-bubble-me)' : 'var(--bg-bubble-them)';
                    
                    if (msg.media_url) {
                        div.innerHTML = `<img src="${msg.media_url}" class="max-h-60 rounded-xl object-cover mb-1"><span class="text-[10px] text-amber-300">${msg.message_text}</span>`;
                    } else {
                        div.innerText = msg.message_text;
                    }
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } else {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center";
                container.innerHTML = `<p class="text-xs text-gray-400">No messages yet. Send a message globally!</p>`;
            }
        }

        function startWhatsAppCall(mode) {
            const modal = document.getElementById('whatsAppCallModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            document.getElementById('callPeerName').innerText = currentActiveRecipient ? currentActiveRecipient.name : 'Global Call';
            setTimeout(() => { document.getElementById('callLiveStatus').innerText = 'Connected (HD Secure)'; }, 2000);
        }

        function endWhatsAppCall() {
            const modal = document.getElementById('whatsAppCallModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            showToast('Call ended');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            applyTheme(currentTheme);
            await detectCountryDialCode();

            const savedAccount = JSON.parse(localStorage.getItem('salaam_active_account') || 'null');
            if (savedAccount && savedAccount.phone) {
                unlockMainChatApp(savedAccount);
            } else {
                document.getElementById('view-verification').style.display = 'flex';
            }
        });
    </script>
</body>
</html>
