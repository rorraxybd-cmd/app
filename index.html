<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SALAAM - rorraxy.com</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#050806">
    <style>
        :root {
            --bg-retail: #050806;
            --card-retail: #08120c;
            --emerald-border: rgba(46, 213, 115, 0.22);
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --pink-solid: linear-gradient(135deg, #ff2a85 0%, #ff479b 100%);
            --text-white: #ffffff;
            --text-gray: #a8b5ad;
            --font-main: 'Poppins', sans-serif;
            --success-green: #2ed573;
        }

        body { 
            background-color: var(--bg-retail); 
            color: var(--text-white); 
            font-family: var(--font-main); 
            -webkit-tap-highlight-color: transparent;
        }

        .gold-gradient-text {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .pink-gradient-text {
            background: var(--pink-solid);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .gold-btn { 
            background: var(--gold-gradient); 
            color: #050806; 
            font-weight: 600; 
            box-shadow: 0 4px 14px rgba(212, 175, 55, 0.25);
        }
        .gold-btn:hover { opacity: 0.92; transform: translateY(-0.5px); }

        .pink-btn {
            background: var(--pink-solid);
            color: #ffffff;
            font-weight: 600;
            box-shadow: 0 4px 18px rgba(255, 42, 133, 0.35);
        }
        .pink-btn:hover { opacity: 0.92; transform: scale(1.03); }

        @keyframes luxuryPulseRing {
            0% {
                transform: scale(0.96);
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.5), 0 0 20px rgba(212, 175, 55, 0.15);
            }
            50% {
                transform: scale(1.03);
                box-shadow: 0 0 0 14px rgba(212, 175, 55, 0), 0 0 28px rgba(212, 175, 55, 0.3);
            }
            100% {
                transform: scale(0.96);
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0), 0 0 20px rgba(212, 175, 55, 0.15);
            }
        }

        @keyframes outerWaveLoop {
            0% { transform: scale(1); opacity: 0.6; }
            100% { transform: scale(1.48); opacity: 0; }
        }

        .call-circle-loop {
            animation: luxuryPulseRing 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        .call-wave-loop {
            animation: outerWaveLoop 2.4s cubic-bezier(0.2, 0.6, 0.4, 1) infinite;
        }

        /* Completely hide scrollbars across all mobile and desktop browsers */
        * {
            scrollbar-width: none !important;
            -ms-overflow-style: none !important;
        }
        *::-webkit-scrollbar {
            display: none !important;
            width: 0 !important;
            height: 0 !important;
        }
    </style>
</head>
<body class="h-[100dvh] flex flex-col overflow-hidden pb-16 md:pb-0 select-none bg-[#050806]">

    <!-- Top Header Bar -->
    <header class="bg-[#070d09] px-4 py-3 flex justify-between items-center border-b border-emerald-500/15 shrink-0 z-30 shadow-lg">
        <div class="flex items-center space-x-3">
            <div class="relative p-[2px] rounded-full" style="background: var(--gold-gradient);">
                <img src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" onerror="this.src='https://placehold.co/80x80/08120c/d4af37?text=S'" alt="SALAAM Logo" class="w-10 h-10 rounded-full object-cover bg-[#050806]">
            </div>
            <div>
                <div class="flex items-center space-x-1.5">
                    <h1 class="font-extrabold text-base tracking-widest gold-gradient-text">SALAAM</h1>
                    <svg class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none">
                        <defs>
                            <linearGradient id="badgeGold" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#bf953f"/>
                                <stop offset="50%" stop-color="#fcf6ba"/>
                                <stop offset="100%" stop-color="#aa771c"/>
                            </linearGradient>
                        </defs>
                        <circle cx="12" cy="12" r="10" fill="url(#badgeGold)"/>
                        <path d="M8.5 12.2L10.8 14.5L15.5 9.5" stroke="#050806" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <a href="https://rorraxy.com" target="_blank" rel="noopener noreferrer" class="text-[11px] text-white/95 hover:text-amber-300 transition block tracking-wide">rorraxy.com</a>
            </div>
        </div>
        
        <div class="flex items-center space-x-2.5">
            <div class="flex items-center space-x-2 bg-[#0a140e] px-3.5 py-1.5 rounded-full border border-emerald-500/30 shadow-inner">
                <span class="w-2 h-2 rounded-full bg-[#2ed573] inline-block animate-pulse shadow-[0_0_8px_#2ed573]"></span>
                <span class="text-[11px] text-white font-medium tracking-wide">Online</span>
            </div>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="flex flex-1 overflow-hidden relative">
        
        <!-- Sidebar: Content Lists -->
        <div id="sidebarSection" class="w-full md:w-[360px] bg-[#070d09] flex flex-col justify-between border-r border-emerald-500/15 shrink-0 z-20 h-full">
            <div class="flex flex-col flex-1 overflow-hidden">
                
                <!-- Search Bar -->
                <div id="searchBarContainer" class="p-3 bg-[#050806] border-b border-emerald-500/10 shrink-0">
                    <div class="flex items-center space-x-2 bg-[#0a140e] px-3.5 py-2 rounded-xl border border-emerald-500/20 focus-within:border-amber-400/50 transition">
                        <input type="text" id="searchInput" placeholder="Search..." class="w-full bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-0.5" oninput="filterContent()">
                        <button onclick="filterContent()" class="cursor-pointer p-1 hover:scale-110 transition-transform" title="Search">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none">
                                <defs>
                                    <linearGradient id="searchIconGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                        <stop offset="0%" stop-color="#bf953f"/>
                                        <stop offset="50%" stop-color="#fcf6ba"/>
                                        <stop offset="100%" stop-color="#aa771c"/>
                                    </linearGradient>
                                </defs>
                                <circle cx="11" cy="11" r="7.5" stroke="url(#searchIconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></circle>
                                <line x1="20.5" y1="20.5" x2="16.35" y2="16.35" stroke="url(#searchIconGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Dynamic Content Area -->
                <div id="sidebarContentList" class="flex-1 overflow-y-auto divide-y divide-emerald-500/10 pb-20 md:pb-4">
                    <!-- Populated dynamically on load -->
                </div>
            </div>
        </div>

        <!-- Active Chat & Interaction Box Section -->
        <div id="workspaceSection" class="hidden md:flex flex-col bg-[#050806] flex-1 overflow-hidden h-full z-10 relative">
            
            <!-- Active Chat Header -->
            <div id="activeChatHeader" class="bg-[#070d09] px-4 py-3 hidden items-center justify-between border-b border-emerald-500/15 shrink-0 shadow-md">
                <div class="flex items-center space-x-3">
                    <button onclick="backToSidebarMobile()" class="md:hidden p-1.5 rounded-lg bg-[#0c1811] border border-emerald-500/20 hover:border-amber-400 transition cursor-pointer" title="Back">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"></polyline>
                        </svg>
                    </button>
                    <div class="relative">
                        <img id="activeChatAvatar" src="https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg" onerror="this.src='https://placehold.co/80x80/08120c/d4af37?text=U'" class="w-9 h-9 rounded-full object-cover border border-amber-500/40">
                        <span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-[#2ed573] rounded-full border-2 border-[#070d09]"></span>
                    </div>
                    <div>
                        <span id="activeChatTitle" class="font-semibold text-white text-xs tracking-wide block">Select a contact</span>
                        <p id="activeChatStatus" class="text-[10px] text-[#2ed573] font-medium">Online</p>
                    </div>
                </div>

                <!-- Call & Delete-All Icons -->
                <div class="flex items-center space-x-2">
                    <button onclick="triggerCall('audio')" class="p-2 bg-[#0b1610] rounded-xl hover:bg-[#122219] border border-emerald-500/20 hover:border-amber-400/50 transition group cursor-pointer" title="Audio Call">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                        </svg>
                    </button>
                    <button onclick="triggerCall('video')" class="p-2 bg-[#0b1610] rounded-xl hover:bg-[#122219] border border-emerald-500/20 hover:border-amber-400/50 transition group cursor-pointer" title="Video Call">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="23 7 16 12 23 17 23 7"></polygon>
                            <rect x="1" y="5" width="15" height="14" rx="2.5" ry="2.5"></rect>
                        </svg>
                    </button>
                    <button onclick="clearChatHistory()" class="p-2 bg-[#0b1610] rounded-xl hover:bg-pink-950/30 border border-emerald-500/20 hover:border-pink-500/50 transition group cursor-pointer" title="Delete All">
                        <svg class="w-4 h-4 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="#ff2a85" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Messages Area -->
            <div id="chatMessages" class="flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center">
                <div class="flex flex-col items-center space-y-3 max-w-xs text-center">
                    <div class="w-14 h-14 rounded-2xl bg-[#0a140e] border border-emerald-500/20 flex items-center justify-center shadow-lg">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                        </svg>
                    </div>
                    <p class="text-sm font-bold gold-gradient-text tracking-wide">Assalamu Alaikum</p>
                    <p class="text-[11px] text-[var(--text-gray)]">Select a contact to start messaging.</p>
                </div>
            </div>

            <!-- Input Bar with Centered Telegram-Style Golden Send Arrow -->
            <div id="chatInputBar" class="bg-[#070d09] px-3 py-2.5 hidden items-center border-t border-emerald-500/15 shrink-0 sticky bottom-0 z-20">
                <div class="flex-1 flex items-center bg-[#0a140e] rounded-2xl px-3.5 py-2 space-x-2.5 border border-emerald-500/25 focus-within:border-amber-400/60 transition">
                    <label class="cursor-pointer hover:scale-110 transition-transform flex items-center justify-center shrink-0" title="Attach Files">
                        <svg class="w-5 h-5 text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                        </svg>
                        <input type="file" id="universalFileInput" accept="image/*,video/*,application/pdf,.doc,.docx,.zip,.txt" multiple class="hidden" onchange="sendUniversalFile(this)">
                    </label>
                    <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 bg-transparent text-xs focus:outline-none text-white placeholder-gray-500 py-1 min-w-0" oninput="toggleSendButton()" onkeypress="if(event.key === 'Enter') sendTextMessage()">
                    
                    <!-- Centered Telegram-Style Golden Send Arrow -->
                    <button id="sendBtn" onclick="sendTextMessage()" class="hidden cursor-pointer hover:scale-110 transition-transform p-1 shrink-0 items-center justify-center" title="Send">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none">
                            <defs>
                                <linearGradient id="telegramSendGrad" x1="0" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                                    <stop offset="0%" stop-color="#bf953f"/>
                                    <stop offset="50%" stop-color="#fcf6ba"/>
                                    <stop offset="100%" stop-color="#aa771c"/>
                                </linearGradient>
                            </defs>
                            <path d="M22 2L11 13" stroke="url(#telegramSendGrad)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M22 2L15 22L11 13L2 9L22 2Z" fill="url(#telegramSendGrad)" fill-opacity="0.28" stroke="url(#telegramSendGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- Fixed Bottom 3 Navigation Menu Bar (Tighter Centered Spacing) -->
    <nav class="fixed bottom-0 left-0 right-0 md:w-[360px] bg-[#070d09]/95 backdrop-blur-md flex justify-center items-center py-2 border-t border-emerald-500/20 shrink-0 z-50 shadow-[0_-8px_25px_rgba(0,0,0,0.85)]">
        <div class="flex items-center justify-center gap-10 sm:gap-12">
            <button onclick="switchTab('profile')" id="tabProfile" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 transition group cursor-pointer">
                <div class="nav-icon-wrap transition-transform duration-200">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="8" r="4"></circle>
                        <path d="M20 21a8 8 0 0 0-16 0"></path>
                        <circle cx="12" cy="12" r="10" stroke-opacity="0.4"></circle>
                    </svg>
                </div>
                <span class="nav-label text-[10px] text-gray-400 font-medium tracking-wide">Profile</span>
            </button>
            <button onclick="switchTab('contact')" id="tabContact" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 transition group cursor-pointer">
                <div class="nav-icon-wrap transition-transform duration-200">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#ff2a85" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <span class="nav-label text-[10px] pink-gradient-text font-bold tracking-wide">Contact</span>
            </button>
            <button onclick="switchTab('chat')" id="tabChat" class="flex flex-col items-center justify-center space-y-1 py-0.5 px-2 transition group cursor-pointer">
                <div class="nav-icon-wrap transition-transform duration-200">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                    </svg>
                </div>
                <span class="nav-label text-[10px] text-gray-400 font-medium tracking-wide">Chat</span>
            </button>
        </div>
    </nav>

    <!-- Compact Custom Confirmation Modal -->
    <div id="customConfirmModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#09130d] border border-emerald-500/25 p-5 rounded-2xl max-w-[260px] w-full text-center space-y-3.5 shadow-2xl">
            <p id="confirmModalText" class="text-xs text-white font-medium">Delete?</p>
            <div class="flex space-x-2">
                <button onclick="closeConfirmModal(false)" class="flex-1 py-2 bg-[#112218] text-xs rounded-xl text-gray-300 hover:bg-[#172e20] cursor-pointer">Cancel</button>
                <button onclick="closeConfirmModal(true)" class="flex-1 py-2 pink-btn text-xs rounded-xl cursor-pointer">OK</button>
            </div>
        </div>
    </div>

    <!-- Add / Login Account Modal -->
    <div id="accountModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden items-center justify-center p-4">
        <div class="bg-[#09130d] border border-emerald-500/25 p-5 rounded-2xl max-w-xs w-full space-y-3 shadow-2xl">
            <h3 class="text-xs font-bold gold-gradient-text text-center tracking-wide">Add / Login Profile</h3>
            <input type="text" id="newAccName" placeholder="Full Name" class="w-full bg-[#050806] text-xs px-3 py-2 rounded-xl text-white border border-emerald-500/20 focus:outline-none">
            <input type="text" id="newAccPhone" placeholder="Phone Number (+880...)" class="w-full bg-[#050806] text-xs px-3 py-2 rounded-xl text-white border border-emerald-500/20 focus:outline-none">
            <input type="text" id="newAccUsername" placeholder="Username" class="w-full bg-[#050806] text-xs px-3 py-2 rounded-xl text-white border border-emerald-500/20 focus:outline-none">
            <div class="flex space-x-2 pt-1">
                <button onclick="closeAccountModal()" class="flex-1 py-2 bg-[#112218] text-xs rounded-xl text-gray-300 cursor-pointer">Cancel</button>
                <button onclick="submitNewAccount()" class="flex-1 py-2 gold-btn text-xs rounded-xl cursor-pointer">Login / Add</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toastBanner" class="fixed top-16 left-1/2 -translate-x-1/2 bg-[#0a160f] text-white text-xs px-4 py-2 rounded-full border border-emerald-500/30 shadow-2xl z-50 hidden items-center space-x-2">
        <span id="toastDot" class="w-2 h-2 rounded-full bg-[#2ed573]"></span>
        <span id="toastText">Done</span>
    </div>

    <!-- Application Logic -->
    <script>
        let currentTab = 'contact';
        let currentActiveRecipient = null;
        let activeCallType = null;
        let localMessageStore = {};
        let confirmCallback = null;
        let isLoggedIn = true;

        const RESERVED_USERNAMES = [
            'mrmasudar', 'masudar', 'masudarrahman', 'mrmasudarenterprise',
            'rorraxy', 'rorraxyofficial', 'rorraxyadmin', 'rorraxysupport',
            'salaam', 'salaamchat', 'admin', 'administrator', 'support',
            'ceo', 'founder', 'official', 'system', 'root', 'help', 'moderator'
        ];

        let savedProfiles = [
            {
                name: "Masudar Rahman",
                phone: "+8801700000000",
                username: "mrmasudar",
                dob: "1995-01-01",
                avatar: "https://pub-508ef1e45bab487aadde85a1dba202c4.r2.dev/im.jpg",
                status: "Online",
                isOfficialFounder: true
            }
        ];

        let activeProfileIndex = 0;

        function getActiveProfile() {
            return savedProfiles[activeProfileIndex] || savedProfiles[0];
        }

        let deviceContacts = [
            { name: "rorraxy", phone: "support", appUser: true, status: "Admin Support", lastMsg: "" },
            { name: "Mamun Rashid", phone: "+8801800000000", appUser: true, status: "Online", lastMsg: "" },
            { name: "Local Friend", phone: "+8801900000000", appUser: false, status: "Offline", lastMsg: "" }
        ];

        function showCustomConfirm(text, callback) {
            document.getElementById('confirmModalText').innerText = text;
            confirmCallback = callback;
            const modal = document.getElementById('customConfirmModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeConfirmModal(result) {
            const modal = document.getElementById('customConfirmModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            if (confirmCallback) confirmCallback(result);
            confirmCallback = null;
        }

        function showToast(msg, isError = false) {
            const toast = document.getElementById('toastBanner');
            const dot = document.getElementById('toastDot');
            document.getElementById('toastText').innerText = msg;
            dot.className = isError ? "w-2 h-2 rounded-full bg-[#ff2a85]" : "w-2 h-2 rounded-full bg-[#2ed573]";
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(() => {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2500);
        }

        function isUsernameAllowed(rawUsername) {
            const cleaned = rawUsername.toLowerCase().replace(/[^a-z0-9]/g, '');
            if (cleaned.length < 3) {
                return { valid: false, reason: "Username must be at least 3 characters." };
            }
            const current = getActiveProfile();
            const isRestricted = RESERVED_USERNAMES.some(reserved => 
                cleaned === reserved || cleaned.includes('rorraxy') || cleaned.includes('mrmasudar') || cleaned.includes('salaam')
            );
            if (isRestricted && !current.isOfficialFounder) {
                return { valid: false, reason: "This username is reserved." };
            }
            return { valid: true, formatted: rawUsername.toLowerCase().replace(/[^a-z0-9._]/g, '') };
        }

        function switchTab(tab) {
            currentTab = tab;
            ['profile', 'contact', 'chat'].forEach(t => {
                const btn = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
                if (btn) {
                    const svg = btn.querySelector('svg');
                    const wrap = btn.querySelector('.nav-icon-wrap');
                    const label = btn.querySelector('.nav-label');
                    svg.setAttribute('stroke', '#e5c158');

        function formatMessageText(text) {
            if (!text) return '';
            const escapeHtml = (str) => str.replace(/[&<>"']/g, (m) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[m]));
            const safe = escapeHtml(text);
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            const phoneRegex = /(\+?[0-9][0-9\-\(\)\s]{6,14}[0-9])/g;

            return safe
                .replace(urlRegex, '<a href="$1" target="_blank" rel="noopener noreferrer" class="text-amber-300 underline break-all" onclick="event.stopPropagation()">$1</a>')
                .replace(phoneRegex, (match) => {
                    const cleanTel = match.replace(/[\s\-\(\)]/g, '');
                    return `<a href="tel:${cleanTel}" class="text-amber-300 underline font-semibold" onclick="event.stopPropagation()">${match}</a>`;
                });
        }

        async function sendTextMessage() {
            if (!currentActiveRecipient) return;
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            toggleSendButton();

            const userProfile = getActiveProfile();
            const key = currentActiveRecipient.phone;
            if (!localMessageStore[key]) localMessageStore[key] = [];
            const msgId = 'msg_' + Date.now() + '_' + Math.random();
            localMessageStore[key].push({ id: msgId, phone_number: userProfile.phone, message_text: text, type: 'text' });

            const contactObj = deviceContacts.find(c => c.phone === key);
            if (contactObj) contactObj.lastMsg = text;
            if (currentTab === 'chat') renderChatStories();

            loadMessages();
        }

        async function sendUniversalFile(inputElement) {
            if (!currentActiveRecipient || !inputElement.files || inputElement.files.length === 0) return;
            const files = Array.from(inputElement.files);
            const key = currentActiveRecipient.phone;
            const userProfile = getActiveProfile();
            if (!localMessageStore[key]) localMessageStore[key] = [];

            for (const file of files) {
                let fileType = 'file';
                if (file.type.startsWith('image/')) fileType = 'image';
                else if (file.type.startsWith('video/')) fileType = 'video';

                await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        const fileDataUrl = e.target.result;
                        const msgId = 'msg_' + Date.now() + '_' + Math.random();
                        localMessageStore[key].push({ 
                            id: msgId, 
                            phone_number: userProfile.phone, 
                            message_text: file.name, 
                            media_url: fileDataUrl, 
                            type: fileType 
                        });

                        const contactObj = deviceContacts.find(c => c.phone === key);
                        if (contactObj) {
                            contactObj.lastMsg = fileType === 'image' ? 'Photo' : (fileType === 'video' ? 'Video' : file.name);
                        }
                        resolve();
                    };
                    reader.readAsDataURL(file);
                });
            }

            inputElement.value = '';
            if (currentTab === 'chat') renderChatStories();
            loadMessages();
        }

        function deleteSingleMessage(recipientPhone, messageIndex) {
            showCustomConfirm("Delete?", (confirmed) => {
                if (confirmed) {
                    if (localMessageStore[recipientPhone]) {
                        localMessageStore[recipientPhone].splice(messageIndex, 1);
                        showToast('Deleted');
                        loadMessages();
                    }
                }
            });
        }

        function clearChatHistory() {
            if (!currentActiveRecipient) return;
            showCustomConfirm("Delete all messages & media?", (confirmed) => {
                if (confirmed) {
                    localMessageStore[currentActiveRecipient.phone] = [];
                    showToast('All deleted');
                    loadMessages();
                }
            });
        }

        function triggerAutoDownload(dataUrl, filename) {
            const a = document.createElement('a');
            a.href = dataUrl;
            a.download = filename || 'salaam_file';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('Downloading...');
        }

        function loadMessages() {
            if (!currentActiveRecipient) return;
            const container = document.getElementById('chatMessages');
            const userProfile = getActiveProfile();
            const messages = localMessageStore[currentActiveRecipient.phone] || [];

            container.innerHTML = '';
            if (messages.length > 0) {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col";
                messages.forEach((msg, idx) => {
                    const isMe = msg.phone_number === userProfile.phone;
                    const div = document.createElement('div');
                    div.className = `max-w-[85%] md:max-w-sm p-2.5 rounded-2xl text-xs leading-relaxed shadow-xl relative group transition ${
                        isMe 
                        ? 'bg-gradient-to-br from-[#0e2218] to-[#08150f] border border-emerald-500/25 self-end text-white rounded-br-sm ml-auto' 
                        : 'bg-[#08120c] border border-emerald-500/15 self-start text-white rounded-bl-sm mr-auto'
                    }`;

                    const mediaSrc = msg.media_url;
                    const isImg = msg.type === 'image' || (mediaSrc && mediaSrc.startsWith('data:image'));
                    const isVid = msg.type === 'video' || (mediaSrc && mediaSrc.startsWith('data:video'));
                    const isDoc = msg.type === 'file' && mediaSrc;

                    // Pure Pink Delete Icon with NO dark circular background
                    const deleteIconSvg = `<svg class="w-4 h-4 text-[#ff2a85] hover:scale-110 transition cursor-pointer drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`;

                    let contentHtml = '';

                    if (isImg && mediaSrc) {
                        contentHtml = `
                            <div class="space-y-1.5 relative">
                                <button onclick="deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})" class="absolute top-2 right-2 z-20 cursor-pointer bg-transparent border-0 p-1" title="Delete">${deleteIconSvg}</button>
                                <div class="overflow-hidden rounded-xl bg-black/40 flex justify-center items-center">
                                    <img src="${mediaSrc}" alt="Image" class="max-h-72 w-full object-cover">
                                </div>
                                <div class="flex items-center justify-start pt-0.5 px-1">
                                    <a href="${mediaSrc}" download="${msg.message_text || 'salaam_image.jpg'}" class="text-[11px] pink-gradient-text font-semibold hover:underline cursor-pointer">Download</a>
                                </div>
                            </div>`;
                    } else if (isVid && mediaSrc) {
                        contentHtml = `
                            <div class="space-y-1.5 relative">
                                <button onclick="deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})" class="absolute top-2 right-2 z-20 cursor-pointer bg-transparent border-0 p-1" title="Delete">${deleteIconSvg}</button>
                                <div class="overflow-hidden rounded-xl bg-black/40">
                                    <video src="${mediaSrc}" controls class="max-h-72 w-full object-cover"></video>
                                </div>
                                <div class="flex items-center justify-start pt-0.5 px-1">
                                    <a href="${mediaSrc}" download="${msg.message_text || 'salaam_video.mp4'}" class="text-[11px] pink-gradient-text font-semibold hover:underline cursor-pointer">Download</a>
                                </div>
                            </div>`;
                    } else if (isDoc) {
                        // Auto-download PDF/File immediately when clicked
                        div.setAttribute('ondblclick', `deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})`);
                        contentHtml = `
                            <div onclick="triggerAutoDownload('${mediaSrc}', '${msg.message_text || 'document.pdf'}')" class="flex items-center space-x-2.5 px-1.5 py-1 cursor-pointer hover:opacity-90">
                                <svg class="w-5 h-5 text-amber-300 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                    <polyline points="14 2 14 8 20 8"></polyline>
                                    <line x1="12" y1="18" x2="12" y2="12"></line>
                                    <polyline points="9 15 12 18 15 15"></polyline>
                                </svg>
                                <span class="text-xs text-amber-300 underline font-medium break-all">${msg.message_text || 'Download File'}</span>
                            </div>`;
                    } else {
                        // Clean, selectable text message with zero visible buttons; delete via double-click or long-press
                        div.classList.add('select-text');
                        div.setAttribute('ondblclick', `deleteSingleMessage('${currentActiveRecipient.phone}', ${idx})`);

                        let pressTimer;
                        div.addEventListener('touchstart', () => {
                            pressTimer = setTimeout(() => {
                                deleteSingleMessage(currentActiveRecipient.phone, idx);
                            }, 650);
                        }, { passive: true });
                        div.addEventListener('touchend', () => clearTimeout(pressTimer));
                        div.addEventListener('touchmove', () => clearTimeout(pressTimer));

                        contentHtml = `
                            <div class="px-1 py-0.5 select-text">
                                <p class="whitespace-pre-wrap break-words text-xs select-text">${formatMessageText(msg.message_text)}</p>
                            </div>`;
                    }

                    div.innerHTML = contentHtml;
                    container.appendChild(div);
                });
                container.scrollTop = container.scrollHeight;
            } else {
                container.className = "flex-1 overflow-y-auto p-4 space-y-3 flex flex-col justify-center items-center";
                container.innerHTML = `
                    <div class="flex flex-col items-center space-y-3 max-w-xs text-center">
                        <div class="w-14 h-14 rounded-2xl bg-[#0a140e] border border-emerald-500/20 flex items-center justify-center shadow-lg">
                            <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="#e5c158" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
                            </svg>
                        </div>
                        <p class="text-sm font-bold gold-gradient-text tracking-wide">Start Conversation</p>
                        <p class="text-[11px] text-[var(--text-gray)]">Send a message or attach files below.</p>
                    </div>`;
            }
        }

        // Initialize default view on load
        window.addEventListener('DOMContentLoaded', () => {
            switchTab('contact');
        });
    </script>
</body>
</html>
